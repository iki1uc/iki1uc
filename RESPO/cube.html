<script>
document.addEventListener("DOMContentLoaded", async () => {

  const faces = {
    front:  document.querySelector(".front"),
    back:   document.querySelector(".back"),
    left:   document.querySelector(".left"),
    right:  document.querySelector(".right"),
    top:    document.querySelector(".top"),
    bottom: document.querySelector(".bottom")
  };

  const modules = {
    front:  "./Master-Kern/system-check.item",
    back:   "./Master-Kern/system-sync.item",
    left:   "./RAW/HW/RAM/ram.map",
    right:  "./RAW/HW/ROM/rom.map",
    top:    "./RAW/HW/CACHE/cache.map",
    bottom: "./RAW/HW/GPU/gpu.map"
  };

  for (const side in modules) {
    try {
      const res = await fetch(modules[side]);
      faces[side].innerText = res.ok ? "OK" : "ERR";
      faces[side].style.color = res.ok ? "#0f0" : "#f00";
    } catch {
      faces[side].innerText = "ERR";
      faces[side].style.color = "#f00";
    }
  }

});
</script>
