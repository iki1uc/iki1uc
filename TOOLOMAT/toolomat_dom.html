<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TOOLOMAT DOM · Vierfach-Achsenbildung</title>

<style>
body {
  background:#000;
  color:#0f0;
  font-family:monospace;
  padding:20px;
}

input {
  width:120px;
  padding:8px;
  background:#111;
  color:#0f0;
  border:1px solid #333;
  margin-right:10px;
}

button {
  padding:10px 20px;
  background:#111;
  color:#0f0;
  border:1px solid #333;
  cursor:pointer;
}

#out {
  background:#111;
  padding:20px;
  margin-top:20px;
  white-space:pre;
}
</style>
</head>
<body>

<h1>TOOLOMAT DOM – Vierfach-Achsenbildung</h1>

<p>Stationen eingeben:</p>

Φ: <input id="Phi" type="number" step="0.01">
φ: <input id="phi" type="number" step="0.01">
φ²: <input id="phi2" type="number" step="0.01">
φ∞: <input id="phiinfty" type="number" step="0.01">

<button onclick="domScan()">DOM‑SCAN</button>

<pre id="out">Bereit...</pre>

<script>
// ===============================
// DOM-CONTROLLER FÜR 4 STATIONEN
// ===============================

function domScan() {

    // Werte aus DOM holen
    const Phi = parseFloat(document.getElementById("Phi").value);
    const phi = parseFloat(document.getElementById("phi").value);
    const phi2 = parseFloat(document.getElementById("phi2").value);
    const phiinfty = parseFloat(document.getElementById("phiinfty").value);

    const out = document.getElementById("out");

    // Validierung
    if (isNaN(Phi) || isNaN(phi) || isNaN(phi2) || isNaN(phiinfty)) {
        out.textContent = "Bitte alle 4 Stationen eingeben.";
        return;
    }

    // Präsentationsmaß M₅
    const M5 = (Phi + phi + phi2 + phiinfty) / 4;

    // Einzelsicht
    const einzel =
`Einzelsicht:
Φ  → Verhältnisbildung (IKI)
φ  → Rekursionstiefe (BIR)
φ² → Quadraturstabilität (UC)
φ∞ → Unendlichkeitsprojektion (MA³)
`;

    // Ausgabe
    out.textContent =
`=== TOOLOMAT DOM ===

Φ:        ${Phi}
φ:        ${phi}
φ²:       ${phi2}
φ∞:       ${phiinfty}

-----------------------------
M₅ = (Φ + φ + φ² + φ∞) / 4
M₅ = ${M5.toFixed(4)}
-----------------------------

${einzel}

DOM‑Scan abgeschlossen.
Daten bereit für FLÄCHEN‑SCANNER 48 und Argumenteria.
`;
}
</script>

</body>
</html>
