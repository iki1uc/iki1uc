<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>phi2_me · 36E</title>
<style>
body {
  background:#000;
  color:#0f0;
  font-family:monospace;
  padding:16px;
}
pre {
  background:#111;
  padding:12px;
  margin-top:12px;
}
button {
  padding:6px 12px;
  background:#111;
  color:#0f0;
  border:1px solid #333;
  cursor:pointer;
  margin-right:4px;
}
</style>
</head>
<body>

<h1>phi2_me – NC‑Bewegung</h1>

<script>
// NC‑Kernel – Bewegungssystem
const NC = {
  pos: { x: 0, y: 0, r: 20 },

  move(dir) {
    if (dir === "N→") NC.pos.x += 10;
    if (dir === "N←") NC.pos.x -= 10;
    if (dir === "N↑") NC.pos.y -= 10;
    if (dir === "N↓") NC.pos.y += 10;
  },

  circle(type) {
    if (type === "NC↻") NC.pos.r += 2;
    if (type === "NC↺") NC.pos.r -= 2;
    if (type === "NC+") NC.pos.r += 5;
    if (type === "NC-") NC.pos.r -= 5;
  },

  neutral() {
    NC.pos = { x: 0, y: 0, r: 20 };
  }
};

function runNC(cmd) {
  if (cmd.startsWith("N")) NC.move(cmd);
  if (cmd.startsWith("NC")) NC.circle(cmd);
  if (cmd === "N") NC.neutral();

  document.getElementById("nc_out").textContent =
    `x=${NC.pos.x}, y=${NC.pos.y}, r=${NC.pos.r}`;
}
</script>

<div>
  <button onclick="runNC('N→')">N→</button>
  <button onclick="runNC('N←')">N←</button>
  <button onclick="runNC('N↑')">N↑</button>
  <button onclick="runNC('N↓')">N↓</button>

  <button onclick="runNC('NC↻')">NC↻</button>
  <button onclick="runNC('NC↺')">NC↺</button>
  <button onclick="runNC('NC+')">NC+</button>
  <button onclick="runNC('NC-')">NC-</button>

  <button onclick="runNC('N')">Neutral</button>

  <pre id="nc_out">x=0, y=0, r=20</pre>
</div>

</body>
</html>
