<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>phi_ces · 36E</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:16px;}
pre{background:#111;padding:12px;margin-top:12px;}
button{padding:6px 12px;background:#111;color:#0f0;border:1px solid #333;margin-right:4px;cursor:pointer;}
</style>
</head>
<body>

<h1>phi_ces – Phi‑Ratio + Bewertung</h1>

<script>
// --------------------------------------
// 1) Phi‑Modul (NEU)
// --------------------------------------
const PHI = {
  a: 1,
  b: 1,
  next(){
    const n = PHI.a + PHI.b;
    PHI.a = PHI.b;
    PHI.b = n;
    return n;
  },
  ratio(){
    return PHI.b / PHI.a;
  }
};

// --------------------------------------
// 2) Bewertungs‑Kern (NEU)
// --------------------------------------
function RATE(achse, wert, norm){
  return {
    achse,
    wert,
    norm,
    delta: wert - norm,
    status:
      wert === norm ? "Norm" :
      wert > norm && wert < norm * 3 ? "Übernorm" :
      wert >= norm * 3 ? "Extrem" :
      "Unternorm"
  };
}

// --------------------------------------
// 3) Phi‑Bewertung (NEU)
// --------------------------------------
function RATE_PHI(){
  const r = PHI.ratio();
  return RATE("Phi‑Ratio", r, 1.618);
}

// --------------------------------------
// 4) Phi‑Ausführung + Bewertung
// --------------------------------------
function runPhi(){
  const n = PHI.next();
  const rating = RATE_PHI();

  phi_out.textContent =
    `Phi‑Wert: ${n}\n` +
    `Ratio: ${PHI.ratio().toFixed(6)}\n` +
    `Bewertung: ${rating.status}\n` +
    `Delta: ${rating.delta.toFixed(6)}`;
}
</script>

<div>
<button onclick="runPhi()">Phi NEXT</button>
<pre id="phi_out">Phi‑Ratio bereit</pre>
</div>

</body>
</html>
