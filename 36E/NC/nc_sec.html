<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>nc_sec · 36E</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:16px;}
pre{background:#111;padding:12px;margin-top:12px;}
button{padding:6px 12px;background:#111;color:#0f0;border:1px solid #333;margin-right:4px;cursor:pointer;}
</style>
</head>
<body>

<h1>nc_sec – NC‑Bewegung + Bewertung</h1>

<script>
// -----------------------------
// 1) NC‑Modul (Bewegung)
// -----------------------------
const NC={
  pos:{x:0,y:0,r:20},
  move(d){
    if(d==="N→")NC.pos.x+=10;
    if(d==="N←")NC.pos.x-=10;
    if(d==="N↑")NC.pos.y-=10;
    if(d==="N↓")NC.pos.y+=10;
  },
  circle(c){
    if(c==="NC↻")NC.pos.r+=2;
    if(c==="NC↺")NC.pos.r-=2;
    if(c==="NC+")NC.pos.r+=5;
    if(c==="NC-")NC.pos.r-=5;
  },
  neutral(){
    NC.pos={x:0,y:0,r:20};
  }
};

// -----------------------------
// 2) Bewertungs‑Kern (NEU)
// -----------------------------
function RATE(achse, wert, norm){
  return {
    achse,
    wert,
    norm,
    delta: wert - norm,
    status:
      wert === norm ? "Norm" :
      wert > norm && wert < norm * 3 ? "Übernorm" :
      wert >= norm * 3 ? "Extrem" :
      "Unternorm"
  };
}

// -----------------------------
// 3) NC‑Bewertung (NEU)
// -----------------------------
function RATE_NC(pos){
  const dx = Math.abs(pos.x);
  const dy = Math.abs(pos.y);
  const dr = Math.abs(pos.r - 20);

  const sum = dx + dy + dr;

  return RATE("NC‑Bewegung", sum, 50);
}

// -----------------------------
// 4) NC‑Ausführung + Bewertung
// -----------------------------
function runNC(cmd){
  if(cmd.startsWith("N"))NC.move(cmd);
  if(cmd.startsWith("NC"))NC.circle(cmd);
  if(cmd==="N")NC.neutral();

  const rating = RATE_NC(NC.pos);

  nc_out.textContent =
    `x=${NC.pos.x}, y=${NC.pos.y}, r=${NC.pos.r}\n` +
    `Bewertung: ${rating.status}\n` +
    `Delta: ${rating.delta}`;
}
</script>

<div>
<button onclick="runNC('N→')">N→</button>
<button onclick="runNC('N←')">N←</button>
<button onclick="runNC('N↑')">N↑</button>
<button onclick="runNC('N↓')">N↓</button>
<button onclick="runNC('NC↻')">NC↻</button>
<button onclick="runNC('NC↺')">NC↺</button>
<button onclick="runNC('NC+')">NC+</button>
<button onclick="runNC('NC-')">NC-</button>
<button onclick="runNC('N')">Neutral</button>

<pre id="nc_out">x=0, y=0, r=20</pre>
</div>

</body>
</html>
