<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>phiinfty_run · 36E</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:16px;}
pre{background:#111;padding:12px;margin-top:12px;}
button{padding:6px 12px;background:#111;color:#0f0;border:1px solid #333;cursor:pointer;margin-right:4px;}
</style>
</head>
<body>

<h1>phiinfty_run – Phi∞‑Ratio + Bewertung</h1>

<script>
// --------------------------------------
// Phi‑Modul (Standalone)
// --------------------------------------
const PHI = {
  a: 1,
  b: 1,
  next(){
    const n = this.a + this.b;
    this.a = this.b;
    this.b = n;
    return n;
  },
  ratio(){
    return this.b / this.a;
  }
};

// --------------------------------------
// Bewertungssystem (Standalone)
// --------------------------------------
function RATE(achse, wert, norm){
  return {
    achse,
    wert,
    norm,
    delta: wert - norm,
    status:
      wert === norm ? "Norm" :
      wert > norm && wert < norm * 3 ? "Übernorm" :
      wert >= norm * 3 ? "Extrem" :
      "Unternorm"
  };
}

function RATE_PHI(){
  return RATE("Phi∞‑Ratio", PHI.ratio(), 1.618);
}

// --------------------------------------
// Phi∞‑Modul
// --------------------------------------
const PHI_INFINITY = {
  step: 0,
  next(){
    this.step++;
    return PHI.next();
  },
  ratio(){
    return PHI.ratio();
  },
  rating(){
    return RATE_PHI();
  }
};

// --------------------------------------
// Ausführung
// --------------------------------------
function runPhiInfinity(){
  const value = PHI_INFINITY.next();
  const ratio = PHI_INFINITY.ratio();
  const rating = PHI_INFINITY.rating();

  phi_out.textContent =
    `Phi∞‑Step: ${PHI_INFINITY.step}\n` +
    `Phi∞‑Wert: ${value}\n` +
    `Ratio∞: ${ratio.toFixed(6)}\n` +
    `Bewertung∞: ${rating.status}\n` +
    `Delta∞: ${rating.delta.toFixed(6)}`;
}
</script>

<div>
<button onclick="runPhiInfinity()">Phi∞ NEXT</button>
<pre id="phi_out">Phi∞‑System bereit</pre>
</div>

</body>
</html>
