<h1>phiinfty_me – Phi∞‑Ratio + Bewertung</h1>

<script>
// --------------------------------------
// Phi‑Modul (Standalone)
// --------------------------------------
const PHI = {
  a: 1,
  b: 1,
  next(){
    const n = this.a + this.b;
    this.a = this.b;
    this.b = n;
    return n;
  },
  ratio(){
    return this.b / this.a;
  }
};

// --------------------------------------
// Bewertungssystem (Standalone)
// --------------------------------------
function RATE(achse, wert, norm){
  return {
    achse,
    wert,
    norm,
    delta: wert - norm,
    status:
      wert === norm ? "Norm" :
      wert > norm && wert < norm * 3 ? "Übernorm" :
      wert >= norm * 3 ? "Extrem" :
      "Unternorm"
  };
}

function RATE_PHI(){
  return RATE("Phi∞‑Ratio", PHI.ratio(), 1.618);
}
