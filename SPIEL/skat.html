<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Skat Karten · RESPO</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:20px;text-align:center;}
button{padding:10px 20px;background:#111;color:#0f0;border:1px solid #333;cursor:pointer;}
pre{background:#111;padding:10px;margin-top:20px;}
</style>
</head>
<body>

<h1>Skat Karten Generator</h1>

<button onclick="drawCard()">Karte ziehen</button>

<pre id="out">Noch keine Karte gezogen...</pre>

<script>
const suits=["Kreuz","Pik","Herz","Karo"];
const ranks=["7","8","9","10","Bube","Dame","König","Ass"];

function drawCard(){
  const suit=suits[Math.floor(Math.random()*suits.length)];
  const rank=ranks[Math.floor(Math.random()*ranks.length)];
  document.getElementById("out").textContent=`${rank} ${suit}`;
}
</script>

</body>
</html>
