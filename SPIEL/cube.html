<script type="module">
import { lagePosition, cubeTransform } from "../../TOOLOMAT/GEOMETRIA.js";

function applyLAGE(Phi, phi, phi2, phiinfty){
    const pos = lagePosition(Phi, phi, phi2, phiinfty);
    const cube = document.getElementById("cube");

    cube.style.transform = `
        translateX(${pos.x}px)
        translateY(${pos.y}px)
        translateZ(${pos.z}px)
        scale(${1 + pos.stabil/10})
    `;
}
</script>
