<!DOCTYPE html>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap');
:root{
  --c:#00ccff;--sp:22s;--bg:#02060a;
  --go:#ffd700;--au:#8cf0d0;--cy:#38c6e0;--pk:#ff3ea5;--warm:#ff8c66;
  --line:#1c1c26;--panel:#0a0a0f;
}
*{box-sizing:border-box;font-family:'JetBrains Mono',ui-monospace,monospace;margin:0;padding:0}
html,body{background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden}
button,select,input{font:inherit;font-size:11px;color:#fff;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:4px 8px;cursor:pointer;
  transition:all .3s}
button:hover{border-color:var(--c);color:var(--c)}
button.on{background:var(--c);color:#000;border-color:var(--c);font-weight:700}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:rgba(2,6,10,.95);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--c);padding:8px 12px}
.hdr-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr-logo{font-size:18px;font-weight:800;letter-spacing:.15em;color:var(--c);
  text-shadow:0 0 12px var(--c)}
.hdr-sub{font-size:9px;letter-spacing:.2em;color:#a855f7}
.hdr-badges{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.badge{padding:2px 6px;border:1px solid var(--line);font-size:9px;letter-spacing:.05em;
  border-radius:3px;color:#888}
.badge.ok{background:rgba(140,240,208,.15);border-color:var(--au);color:var(--au)}
.badge.warn{background:rgba(255,140,102,.15);border-color:var(--warm);color:var(--warm)}
.badge.master{background:var(--go);color:#000;border-color:var(--go);font-weight:800;
  animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* NAV */
.nav{display:flex;gap:2px;padding:6px 12px;background:#05080d;border-bottom:1px solid var(--line);
  overflow-x:auto;position:sticky;top:52px;z-index:99}
.nav button{font-size:10px;padding:5px 10px;letter-spacing:.08em;white-space:nowrap;
  border-radius:3px;background:transparent;border:1px solid transparent;color:#666}
.nav button.on{background:var(--c);color:#000;border-color:var(--c);font-weight:700}

/* LAYOUT */
.main{display:grid;grid-template-columns:210px 1fr 320px;gap:8px;padding:8px;min-height:calc(100vh - 110px)}
@media(max-width:1100px){.main{grid-template-columns:180px 1fr}.main>.side-right{display:none}}
@media(max-width:760px){.main{grid-template-columns:1fr}.main>.side-left{display:none}}

.side-left{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;
  overflow-y:auto;max-height:calc(100vh - 130px);position:sticky;top:110px}
.side-left .sec{font-size:9px;letter-spacing:.15em;color:#666;text-transform:uppercase;
  padding:8px 4px 4px;border-bottom:1px dashed var(--line);margin-bottom:4px;font-weight:700}
.side-left .item{padding:5px 8px;font-size:10px;border:1px solid transparent;border-radius:3px;
  cursor:pointer;display:flex;justify-content:space-between;transition:all .3s;
  width:100%;text-align:left;background:transparent;color:#c8d8e8;margin-bottom:2px}
.side-left .item:hover{background:rgba(0,204,255,.06);border-color:var(--line)}
.side-left .item.on{background:var(--c);color:#000;border-color:var(--c);font-weight:700}

.center{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:10px;overflow-y:auto;max-height:calc(100vh - 130px)}
.side-right{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:8px;overflow-y:auto;max-height:calc(100vh - 130px);
  position:sticky;top:110px}

.dsec{background:#0a0a10;border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px}
.dsec h3{font-size:9px;letter-spacing:.15em;color:var(--c);text-transform:uppercase;
  margin-bottom:6px;font-weight:700}
.drow{display:flex;justify-content:space-between;font-size:10px;padding:2px 0;color:#888}
.drow b{color:#fff}

/* VIEW HEADER */
.vh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
  padding-bottom:8px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:6px}
.vh h2{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--c);font-weight:700}

/* KONTRO */
.kontro-meta{border:1px solid var(--go);background:#0a0a10;border-radius:6px;padding:12px;
  margin-bottom:12px;box-shadow:0 0 12px rgba(255,215,0,.15)}
.kontro-meta.warn{border-color:var(--warm);box-shadow:0 0 12px rgba(255,140,102,.15)}
.kontro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(max-width:900px){.kontro-grid{grid-template-columns:1fr}}
.kcard{background:#0a0a10;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  transition:all .4s}
.kcard.ok{border-color:var(--au)}
.kcard.no{border-color:var(--warm)}
.kcard-hdr{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;
  border-bottom:1px solid var(--line);background:#05080d}
.kcard-axiom{padding:2px 6px;background:var(--go);color:#000;font-weight:800;font-size:10px;
  border-radius:2px}
.kcard-badge{padding:1px 5px;border:1px solid var(--line);font-size:8px;border-radius:2px;
  color:#888;margin-left:3px}
.kcard-badge.ax{border-color:#00ccff;color:#00ccff}
.kcard-badge.rule{border-color:var(--warm);color:var(--warm)}
.kcard-dot{width:6px;height:6px;border-radius:3px}
.kcard-dot.ok{background:var(--au);box-shadow:0 0 6px var(--au)}
.kcard-dot.err{background:var(--warm)}
.kcard-sides{padding:6px 10px 0;display:flex;gap:4px;font-size:8px;flex-wrap:wrap}
.kcard-side{padding:1px 6px;background:#05080d;border:1px solid var(--line);border-radius:2px}
.kcard-state{padding:6px 10px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:9px}
.kcard-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:2px 0}
.kcard-row span:first-child{opacity:.4}
.kcard-row span:last-child{font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard-proof{padding:0 10px 8px}
.proof-btn{width:100%;padding:4px 8px;background:#05080d;border:1px solid var(--line);font-size:9px;
  border-radius:3px;display:flex;justify-content:space-between;color:#c8d8e8;cursor:pointer}
.proof-body{margin-top:6px;background:#05080d;border:1px solid var(--line);padding:8px;
  border-radius:4px;font-size:8.5px;line-height:1.4}
.proof-sect{margin-bottom:6px}
.proof-sect-hdr{font-size:8px;letter-spacing:.15em;color:#666;text-transform:uppercase;

.proof-claim{color:var(--go);font-weight:700;margin-bottom:3px}
.proof-line{color:#888;padding-left:6px}
.proof-line.ok{color:var(--au)}

/* AXIOM */
.axiom-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:760px){.axiom-grid{grid-template-columns:1fr}}
.axiom-panel{background:#0a0a10;border:1px solid var(--line);border-radius:4px;padding:10px}
.axiom-panel h3{font-size:9px;letter-spacing:.15em;color:var(--go);text-transform:uppercase;

.axiom-row{display:grid;grid-template-columns:50px 1fr 70px 50px;gap:6px;align-items:center;
  padding:4px 0;border-bottom:1px dashed var(--line);font-size:9px}
.axiom-row .atom{color:#00ccff;font-weight:700}
.axiom-row .name{color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.axiom-row .val{color:var(--go);font-weight:700;text-align:right}
.axiom-row .exec{padding:1px 6px;border:1px solid var(--line);border-radius:2px;font-size:8px;

.axiom-row .exec:hover{border-color:var(--go);color:var(--go)}
.rule-row{display:grid;grid-template-columns:35px 1fr auto;gap:6px;padding:4px 0;

.rule-row .rid{color:var(--warm);font-weight:700}
.rule-row .rname{color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule-row .rstatus{padding:1px 5px;border-radius:2px;font-size:8px;font-weight:700}
.rule-row .rstatus.ok{background:var(--au);color:#000}
.rule-row .rstatus.err{background:var(--warm);color:#000}

.qaxis .name{font-size:14px;font-weight:800;color:var(--c)}
.qaxis .slot{font-size:8px;color:#666;letter-spacing:.1em}
.qaxis .val{font-size:11px;font-weight:700;color:var(--go)}

.octa-panel{border:2px solid var(--go);background:#0a0a10;border-radius:6px;padding:12px;
  margin-bottom:12px;box-shadow:0 0 20px rgba(255,215,0,.15)}
.octa-layer{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.octa-layer div{background:#05080d;border:1px solid var(--line);border-radius:3px;
  padding:6px;font-size:9px;text-align:center}
.octa-layer div b{display:block;color:var(--go);font-size:11px;margin-bottom:2px}

/* INDEXER */
.idx-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.idx-group{border:1px solid var(--line);border-radius:4px;padding:2px;background:#05080d;

.idx-cell{width:14px;height:14px;border-radius:2px;cursor:pointer;transition:transform .15s;
  border:1px solid rgba(0,0,0,.3);position:relative}
.idx-cell:hover{transform:scale(1.6);z-index:10;box-shadow:0 0 10px currentColor}
.idx-cell.ram{outline:2px solid var(--au);outline-offset:-1px}
.idx-cell.ram::after{content:'●';position:absolute;top:-4px;right:-4px;font-size:8px;
  color:var(--au);text-shadow:0 0 4px var(--au)}

/* PIPELINE */
.pipe-row{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:12px}
@media(max-width:900px){.pipe-row{grid-template-columns:repeat(3,1fr)}}
.pipe-stage{background:#0a0a10;border:1px solid var(--line);border-radius:4px;padding:6px;
  text-align:center;font-size:9px;transition:all .3s}
.pipe-stage.done{border-color:var(--au);background:rgba(140,240,208,.08)}
.pipe-stage.running{border-color:var(--go);background:rgba(255,215,0,.15);
  animation:pulse 1.5s infinite}
.pipe-stage .circle{width:24px;height:24px;border-radius:50%;border:1px solid currentColor;
  display:flex;align-items:center;justify-content:center;margin:0 auto 4px;
  font-weight:700;font-size:11px}
.pipe-stage.done .circle{color:var(--au)}
.pipe-stage.running .circle{color:var(--go)}
.pipe-stage.idle .circle{color:#444}
.pipe-stage .lbl{font-weight:700;color:#c8d8e8}
.pipe-stage .sub{font-size:8px;color:#666;margin-top:2px}

/* LOG */
.log{background:#05080d;border:1px solid var(--line);border-radius:4px;padding:8px;
  font-size:9px;line-height:1.5;max-height:150px;overflow-y:auto;color:#888}
.log div{border-left:2px solid var(--line);padding-left:6px;margin-bottom:2px}
.log div.ok{border-color:var(--au);color:var(--au)}
.log div.warn{border-color:var(--warm);color:var(--warm)}
.log div.master{border-color:var(--go);color:var(--go)}

/* CANVAS */
.canvas-wrap{background:#05080d;border:1px solid var(--line);border-radius:6px;
  overflow:hidden;margin-bottom:12px}
canvas{display:block;width:100%;height:auto}

/* FOOTER */
.ftr{background:rgba(2,6,10,.95);border-top:1px solid var(--line);padding:6px 12px;
  font-size:9px;color:#666;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.ftr b{color:var(--go)}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--go);
  color:#000;padding:6px 14px;font-weight:700;font-size:11px;opacity:0;transition:opacity .3s;
  pointer-events:none;z-index:200;border-radius:4px}
.toast.show{opacity:1}
</style>

// ============================================================
// BIO (zirkadian)
// ============================================================
function computeBIO(t){
  const n = (s,c=0)=>(Math.sin(t*s+c)+1)/2;
  return {
    t,
    aura: 0.55+0.42*Math.sin(t*0.34),
    mana: 0.60+0.35*Math.sin(t*0.41+1.1),
    zen:  0.62+0.33*Math.sin(t*0.22+2.3),
    cpu:  0.50+0.45*Math.sin(t*0.71+0.5),
    ram:  0.55+0.40*Math.sin(t*0.53+0.9),
    rom:  n(0.19,0.3),
    gpu:  n(0.6,1.9),
    move: n(0.8,2.5),
    fps:  58+Math.sin(t*2)*4,
    good: 0
  };
}

// ============================================================
// Ω KOMBINATOR
// ============================================================
function computeOmega(bio, beon){
  const axiomWerte = Object.keys(AXIOM_EXEC).map(k => {
    const a = AXIOM_EXEC[k]({...bio, beon});
    return { atom: k, name: a.name, wert: a.wert };
  });
  const regelErgebnisse = KONTRO.map(K => {
    const r = RULES_EXEC[K.rule](K, bio, beon);
    return { id: K.id, rule: K.rule, axiom: K.ax, ...r };
  });
  let roh = 1;
  for (const a of axiomWerte){
    const w = typeof a.wert === "number" && isFinite(a.wert) ? a.wert : 1;
    roh = roh * w + (roh + w);
  }
  const alleKonsistent = regelErgebnisse.every(r => r.konsistent);
  return {
    axiomWerte, regelErgebnisse,
    omega: alleKonsistent ? 1 : 0,
    rohOmega: isFinite(roh) ? roh : "∞",
    geerdet: 0, priorisiert: beon ? "∞" : 1,
    konsistent: alleKonsistent
  };
}

          h("div", {className:"drow"}, h("span", null, "Regeln"), h("b", null, `${omega.regelErgebnisse.filter(r=>r.konsistent).length}/6`)),
          h("div", {className:"drow"}, h("span", null, "RAM"), h("b", null, `${ram.size + ramWurzel.size}/270`)),
          h("div", {className:"drow"}, h("span", null, "BEON"), h("b", {style:{color:beon ? "var(--go)" : "#666"}}, beon ? "♛ ON" : "off")),
          h("div", {className:"drow"}, h("span", null, "fps"), h("b", null, bio.fps.toFixed(0)))
        ),
        h("div", {className:"dsec"},
          h("h3", null, "Physik"),
          ["aura","mana","zen","cpu","ram","rom","gpu","move"].map(k =>
            h("div", {key:k, className:"drow"},
              h("span", null, k),
              h("b", null, bio[k].toFixed(3)))
          )
        ),
        h("div", {className:"dsec"},
          h("h3", null, "9.html · resonance"),
          h("div", {className:"drow"}, h("span", null, "version"), h("b", {style:{fontSize:8}}, NINE.version)),
          h("div", {className:"drow"}, h("span", null, "resonance"), h("b", null, NINE.resonance.toFixed(3))),
          h("div", {className:"drow"}, h("span", null, "depth"), h("b", null, NINE.depth)),
          h("div", {className:"drow"}, h("span", null, "pump"), h("b", null, NINE.pump)),
          h("div", {className:"drow"}, h("span", null, "note"), h("b", {style:{fontSize:8}}, NINE.note))
        ),
        h("div", {className:"dsec"},
          h("h3", null, "NUTZRAUM Modi"),
          Object.entries(NUTZRAUM.modes).map(([k,v]) =>
            h("div", {key:k, className:"drow"},
              h("span", {style:{color:v.color}}, k),
              h("b", null, v.sp))
          )
        ),
        h("div", {className:"dsec"},
          h("h3", null, "QUAD Fusion"),
          Object.entries(QUAD.fusion).map(([k,v]) =>
            h("div", {key:k, className:"drow"},
              h("span", {style:{color:v.color}}, k),
              h("b", {style:{fontSize:8}}, v.mode))
          )
        ),
        h("div", {className:"dsec"},
          h("h3", null, "ROOT"),
          h("div", {className:"drow"}, h("span", null, "user"), h("b", null, "Ridvan")),
          h("div", {className:"drow"}, h("span", null, "name"), h("b", null, "earl / king")),
          h("div", {className:"drow"}, h("span", null, "nul"), h("b", {style:{fontSize:8}}, "© 2026 iki1uc"))
        )
      )
    ),

    // FOOTER
    h("footer", {className:"ftr"},
      h("div", null,
        `NUTZRAUM.OS · ${view} · Ω=${omega.omega} · 7A×6R×6K · QUAD 8 · OCTA tri · RAM ${ram.size + ramWurzel.size}/270 · ${beon ? "BEON ♛" : "physik pur"}`
      ),
      h("div", null, new Date().toLocaleTimeString("de-DE"))
    ),

    // TOAST
    h("div", {className:`toast ${toast ? "show" : ""}`}, toast)
  );
}

createRoot(document.getElementById("root")).render(
  h(React.StrictMode, null, h(App))
);
</script>
</body>
