<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚖️ NC · WAAGSCHALE · ZENTRUM · ROOT · iki1uc</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg1:#040810; --bg2:#0a1524;
    --cyan:#7fdcff; --cyan2:#c8f0ff;
    --gold:#f0c878; --gold2:#ffe9b0;
    --violet:#a888ff;
    --green:#8cf0d0;
    --line:rgba(127,220,255,0.12);
    --serif:'Yu Mincho','Hiragino Mincho ProN','Times New Roman',serif;
  }
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% 40%, #0c1a2c 0%, #060d18 55%, #020409 100%);
    color:#c8d8e8;
    font-family:'Consolas','Courier New',monospace;
    height:100vh; overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* ── HEADER ─────────────────────────────────── */
  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 20px;
    border-bottom:1px solid var(--line);
    background:rgba(4,8,16,0.85);
    backdrop-filter:blur(14px);
    flex-wrap:wrap; gap:10px; z-index:10;
  }
  header h1{
    font-size:15px; font-weight:300; letter-spacing:4px;
    background:linear-gradient(135deg,#c8f0ff,#7fdcff,#a888ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    font-family:var(--serif);
  }
  header h1 small{
    font-size:9px; color:#5a7288;
    -webkit-text-fill-color:#5a7288;
    letter-spacing:2px; margin-left:8px;
    font-family:'Consolas',monospace;
  }
  header h1 .tag{
    font-size:8px; letter-spacing:3px;
    -webkit-text-fill-color:#f0c878;
    border:1px solid rgba(240,200,120,0.4);
    border-radius:4px; padding:1px 7px; margin-left:8px;
    font-family:'Consolas',monospace;
  }
  .stats{
    display:flex; gap:14px; font-size:9.5px;
    color:#6a8098; align-items:center; flex-wrap:wrap;
  }
  .stats .v-cyan{color:#7fdcff;font-weight:bold;}
  .stats .v-gold{color:#f0c878;font-weight:bold;}
  .stats .v-violet{color:#a888ff;font-weight:bold;}
  .stats .v-green{color:#8cf0d0;font-weight:bold;}

  /* ── STAGE ──────────────────────────────────── */
  #stage{
    flex:1; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  #scaleCanvas{
    display:block; width:100%; height:100%;
    cursor:pointer;
  }

  /* ── SEAL (oben links) ──────────────────────── */
  #seal{
    position:absolute; top:20px; left:22px;
    font-family:var(--serif);
    font-size:11px; letter-spacing:6px;
    color:rgba(127,220,255,0.55);
    text-transform:uppercase;
    z-index:6; pointer-events:none;
    text-align:center;
  }
  #seal .glyph{
    font-size:34px; display:block; line-height:1;
    color:rgba(200,240,255,0.75);
    text-shadow:0 0 20px rgba(127,220,255,0.5);
  }
  #seal .sub{
    font-size:8px; letter-spacing:5px; margin-top:6px;
    font-family:'Consolas',monospace;
    color:rgba(240,200,120,0.6);
  }

  /* ── BALANCE READOUT (oben rechts) ──────────── */
  #balanceBox{
    position:absolute; top:20px; right:22px;
    padding:10px 16px;
    background:rgba(4,8,16,0.75);
    border:1px solid var(--line);
    border-left:2px solid var(--cyan);
    border-radius:6px;
    font-size:10px;
    letter-spacing:1.5px;
    z-index:6; pointer-events:none;
    min-width:150px;
  }
  #balanceBox .row{
    display:flex; justify-content:space-between;
    padding:2px 0;
  }
  #balanceBox .lbl{color:#6a8098;}
  #balanceBox .val{font-weight:bold;color:#c8f0ff;}
  #balanceBox .val.gold{color:#f0c878;}
  #balanceBox .val.violet{color:#a888ff;}
  #balanceBox .title{
    font-family:var(--serif);
    font-size:11px;
    letter-spacing:3px;
    color:#7fdcff;
    border-bottom:1px solid var(--line);
    padding-bottom:5px; margin-bottom:6px;
    display:flex; justify-content:space-between;
  }
  #balanceBox .title .mode{
    font-size:8px;
    color:#f0c878;
    border:1px solid rgba(240,200,120,0.3);
    border-radius:3px;
    padding:0 5px;
    letter-spacing:1px;
  }

  /* ── CONTROLS ───────────────────────────────── */
  #controls{
    display:flex; gap:8px; align-items:center;
    padding:11px 20px;
    border-top:1px solid var(--line);
    background:rgba(4,8,16,0.92);
    backdrop-filter:blur(14px);
    flex-wrap:wrap;
    font-size:10px; z-index:10;
  }
  #controls button{
    background:rgba(8,16,28,0.9);
    border:1px solid rgba(127,220,255,0.28);
    color:var(--cyan);
    padding:6px 15px;
    border-radius:5px;
    font-family:inherit; font-size:10px;
    letter-spacing:2px;
    cursor:pointer; transition:.2s;
    text-transform:uppercase;
  }
  #controls button:hover{
    background:rgba(127,220,255,0.1);
    border-color:var(--cyan);
    color:#fff;
    box-shadow:0 0 16px rgba(127,220,255,0.35);
  }
  #controls button.active{
    background:rgba(127,220,255,0.2);
    color:#fff;
    border-color:var(--cyan);
    box-shadow:0 0 20px rgba(127,220,255,0.5);
  }
  #controls button.gold{
    border-color:rgba(240,200,120,0.35);
    color:var(--gold);
  }
  #controls button.gold:hover,
  #controls button.gold.active{
    background:rgba(240,200,120,0.15);
    border-color:var(--gold);
    color:#fff;
    box-shadow:0 0 16px rgba(240,200,120,0.5);
  }
  #controls button.violet{
    border-color:rgba(168,136,255,0.35);
    color:var(--violet);
  }
  #controls button.violet:hover,
  #controls button.violet.active{
    background:rgba(168,136,255,0.15);
    border-color:var(--violet);
    color:#fff;
    box-shadow:0 0 16px rgba(168,136,255,0.5);
  }
  #controls .sep{
    width:1px; height:22px;
    background:var(--line);
    margin:0 6px;
  }
  #controls .lbl{
    color:#5a7288; font-size:9px; letter-spacing:2px;
  }
  #controls input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:90px; height:3px;
    background:linear-gradient(90deg,var(--cyan),var(--gold));
    border-radius:2px; outline:none;
  }
  #controls input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:14px; border-radius:50%;
    background:#fff;
    border:2px solid var(--cyan);
    box-shadow:0 0 10px var(--cyan);
    cursor:pointer;
  }

  /* ── ROOT LOG (unten links) ─────────────────── */
  #logBox{
    position:absolute; bottom:14px; left:14px;
    max-width:340px; max-height:110px;
    padding:8px 14px;
    background:rgba(4,8,16,0.75);
    border:1px solid var(--line);
    border-left:2px solid var(--gold);
    border-radius:5px;
    font-family:var(--serif);
    font-size:11px;
    line-height:1.55;
    color:#c8d8e8;
    overflow-y:auto;
    z-index:6; pointer-events:none;
    font-style:italic;
  }
  #logBox .time{
    color:#4a5a70;
    font-family:'Consolas',monospace;
    font-style:normal;
    font-size:8.5px;
    margin-right:6px;
  }
  #logBox .root{ color:#7fdcff; font-style:normal; }
  #logBox .scale{ color:#f0c878; font-style:normal; }
  #logBox .node{ color:#a888ff; font-style:normal; }
  #logBox .whisper{ color:#8cf0d0; }

  /* ── ROOT MODE OVERLAY ──────────────────────── */
  #rootIndicator{
    position:absolute; bottom:22px; left:50%;
    transform:translateX(-50%) translateY(20px);
    font-family:var(--serif);
    font-size:13px;
    letter-spacing:8px;
    color:rgba(240,200,120,0.6);
    text-transform:uppercase;
    opacity:0;
    transition:.6s;
    pointer-events:none;
    z-index:7;
  }
  #rootIndicator.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  #rootIndicator .glyph{
    display:block; font-size:24px; letter-spacing:0;
    color:rgba(200,240,255,0.9);
    text-shadow:0 0 24px rgba(127,220,255,0.6);
    margin-bottom:4px;
  }

  @media(max-width:720px){
    header h1{font-size:12px;letter-spacing:2px;}
    #controls{padding:8px 12px; gap:5px;}
    #controls button{padding:5px 10px; font-size:9px; letter-spacing:1px;}
    #logBox{max-width:220px; font-size:10px;}
    #balanceBox{padding:7px 11px; font-size:9px; min-width:120px;}
    #seal{font-size:9px;}
    #seal .glyph{font-size:24px;}
  }
</style>
</head>
<body>

<header>
  <h1>⚖️ NC · WAAGSCHALE
    <small>iki1uc · 起 · 中の軸 · 全てから全てへ</small>
    <span class="tag">ROOT·ZENTRUM</span>
  </h1>
  <div class="stats">
    <span>Balance <b class="v-cyan" id="sBal">0.00</b></span>
    <span>Knoten <b class="v-violet" id="sNodes">6</b></span>
    <span>Last L <b class="v-gold" id="sL">0</b></span>
    <span>Last R <b class="v-gold" id="sR">0</b></span>
    <span>Root <b class="v-green" id="sRoot">aus</b></span>
    <span id="sClock" style="color:#4a5a70;">⏱️ --:--</span>
  </div>
</header>

<div id="stage">
  <canvas id="scaleCanvas"></canvas>

  <!-- Siegel -->
  <div id="seal">
    <span class="glyph">衡</span>
    <span class="sub">NC · AXIS</span>
  </div>

  <!-- Balance-Anzeige -->
  <div id="balanceBox">
    <div class="title">
      <span>WAAGE</span>
      <span class="mode" id="modeBadge">CENTER</span>
    </div>
    <div class="row"><span class="lbl">Neigung</span><span class="val" id="bTilt">0.0°</span></div>
    <div class="row"><span class="lbl">Mitte X</span><span class="val gold" id="bMid">0</span></div>
    <div class="row"><span class="lbl">Kraft</span><span class="val violet" id="bForce">0</span></div>
    <div class="row"><span class="lbl">Fluss</span><span class="val" id="bFlow">0/s</span></div>
  </div>

  <!-- Root-Indikator -->
  <div id="rootIndicator">
    <span class="glyph">根</span>
    ROOT MODUS
  </div>

  <!-- Log -->
  <div id="logBox">
    <div><span class="time">[init]</span><span class="scale">⚖️ Waagschale bereit — alle zu allen.</span></div>
  </div>
</div>

<div id="controls">
  <button id="btnRoot" class="gold">🌱 ROOT</button>
  <button id="btnAuto" class="active">⏸ AUTO</button>
  <button id="btnShift">⇄ SHIFT</button>
  <button id="btnAll2All" class="violet">✦ ALL→ALL</button>
  <span class="sep"></span>
  <span class="lbl">LAST</span>
  <input type="range" id="load" min="1" max="10" value="3">
  <span class="sep"></span>
  <button id="btnReset">⟲ Reset</button>
</div>

<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════
// ⚖️ NC · WAAGSCHALE · ZENTRUM · ROOT
// Das schönste System: alles fließt zur Mitte, die Mitte fließt zu allen.
// 6 NC-Knoten als Schalen um einen Waagepunkt.
// Alle zu allen — 15 Verbindungen, keine Hierarchie.
// ═══════════════════════════════════════════════════════════════════

// ─── KOMPAT-LAYER (identisch zu KLICK / ZaM / MAINBOARD) ───────
const MASTER_KEY='iki1uc-master-respo';
const BC_NAME='iki1uc-orbit';
let masterChannel=null, isMasterConnected=false;
const localMaster={
  stations:{}, klick:0, zack:0, zam:'idle', zoll:'offen',
  me2:{allow:true,boost:false,slow:false,override:false},
  score:0, lastUpdate:Date.now()
};
try{
  const s=localStorage.getItem(MASTER_KEY);
  if(s) Object.assign(localMaster,JSON.parse(s));
}catch(_){}
try{
  masterChannel=new BroadcastChannel(BC_NAME);
  masterChannel.onmessage=(ev)=>{
    const d=ev.data; if(!d||!d.type) return;
    if(d.type==='master:state'&&d.payload){Object.assign(localMaster,d.payload);isMasterConnected=true;}
    if(d.type==='mainboard:done'&&d.payload){
      // Mainboard gibt uns Werte → wir verteilen sie als Last auf die Schalen
      const w=d.payload.compat||50;
      distributeLoad(w/100);
      log(`📊 MAINBOARD → Waage: Kompat ${w.toFixed(0)}%`,'node');
    }
  };
}catch(_){}
function persistMaster(){try{localStorage.setItem(MASTER_KEY,JSON.stringify(localMaster));}catch(_){}}
function sendToMaster(type,payload){
  localMaster.lastUpdate=Date.now(); persistMaster();
  if(masterChannel){try{masterChannel.postMessage({type,from:'NC-SCALE',payload,ts:Date.now()});}catch(_){}}
}

// ─── DIE 6 NC-KNOTEN ───────────────────────────────────────────
// ces / in / me / run / sec / u — die 6 NC-Achsen
const NC_NODES=[
  { id:'ces', name:'NC·CES',  kanji:'切', label:'Cäsur · Schnitt',   color:'#7fdcff' },
  { id:'in',  name:'NC·IN',   kanji:'内', label:'Innen · Kern',      color:'#8cf0d0' },
  { id:'me',  name:'NC·ME',   kanji:'我', label:'Ich · Meta',        color:'#f0c878' },
  { id:'run', name:'NC·RUN',  kanji:'走', label:'Lauf · Bewegung',   color:'#a888ff' },
  { id:'sec', name:'NC·SEC',  kanji:'護', label:'Schutz · Sekunde',  color:'#ff9ec4' },
  { id:'u',   name:'NC·U',    kanji:'宇', label:'Union · Universum', color:'#c8f0ff' },
];

// Jedem Knoten wird ein Winkel zugewiesen (Ring um das Zentrum)
NC_NODES.forEach((n,i)=>{
  n.angle = (i/NC_NODES.length)*Math.PI*2 - Math.PI/2;
  // x/y werden in der Resize-Funktion berechnet
  n.x=0; n.y=0;
  n.load=0;       // aktuelle Last (Gewicht)
  n.targetLoad=0; // Ziel-Last
  n.pulse=0;      // visueller Impuls
});

// ─── STATE ─────────────────────────────────────────────────────
const S={
  tick:0,
  auto:true,
  root:false,
  rate:3,
  loadL:0,       // Last linke Schale (Summe in-Nodes)
  loadR:0,       // Last rechte Schale (Summe u-Nodes)
  tilt:0,        // -1 .. 1 (Balken-Neigung)
  force:0,       // Gesamtkraft
  flow:0,        // Events pro Sekunde
  // Visuals
  links:[],      // Alle-zu-alle Verbindungen
  sparks:[],
  wisps:[],      // sanfte Partikel zwischen Knoten
  rootBranches:[], // beim Root-Modus wachsende Äste
  lastFlowTick:0,
  flowCount:0,
};

// ─── CANVAS ────────────────────────────────────────────────────
const cv=document.getElementById('scaleCanvas');
const ctx=cv.getContext('2d');
let W,H,CX,CY,R,DPR;

function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  DPR=window.devicePixelRatio||1;
  W=r.width; H=r.height;
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2;
  CY=H/2;
  R=Math.min(W,H)*0.30;

  // Knoten-Positionen setzen
  NC_NODES.forEach(n=>{
    n.x = CX + Math.cos(n.angle)*R;
    n.y = CY + Math.sin(n.angle)*R;
  });

  // Verbindungen (alle-zu-alle) vorbereiten
  S.links=[];
  for(let i=0;i<NC_NODES.length;i++){
    for(let j=i+1;j<NC_NODES.length;j++){
      S.links.push({
        a:NC_NODES[i], b:NC_NODES[j],
        strength:0,
        targetStrength:0,
        lastPulse:0,
      });
    }
  }

  buildRootBranches();
}
window.addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe(cv.parentElement);

// ─── ALLE-ZU-ALLE VERBINDUNGEN ─────────────────────────────────
function pulseLink(nodeA,nodeB,strength){
  const l=S.links.find(x=>
    (x.a===nodeA&&x.b===nodeB)||(x.a===nodeB&&x.b===nodeA)
  );
  if(l){
    l.targetStrength = Math.min(1, l.targetStrength + (strength||0.6));
    l.lastPulse=S.tick;
  }
}

// ─── LAST VERTEILEN ────────────────────────────────────────────
function distributeLoad(factor){
  // factor 0..1 → alle Nodes bekommen etwas, aber unterschiedlich
  // Die linken Nodes (ces, me, sec) und rechten (in, run, u) werden
  // gegensätzlich belastet, um die Waage zu neigen
  NC_NODES.forEach((n,i)=>{
    const base = 0.3 + Math.random()*0.7;
    // je nach Winkel: linke/rechte Hälfte unterschiedlich gewichten
    const side = Math.cos(n.angle); // -1..1
    n.targetLoad = Math.max(0, Math.min(1,
      base * factor + side * 0.15
    ));
  });
  S.flowCount++;
}

// ─── AUTO-AKTIVITÄT ────────────────────────────────────────────
function autoTick(now){
  const interval=Math.max(150, 900 - S.rate*70);
  if(now - S.lastFlowTick < interval) return;
  S.lastFlowTick=now;

  // Ein zufälliger Knoten sendet einen Impuls zu einem anderen
  const i=Math.floor(Math.random()*NC_NODES.length);
  let j=Math.floor(Math.random()*NC_NODES.length);
  if(j===i) j=(j+1)%NC_NODES.length;
  const a=NC_NODES[i], b=NC_NODES[j];
  pulseLink(a,b,0.5+Math.random()*0.5);

  // Ein sanfter Wisp wandert
  spawnWisp(a,b);

  // kleine Last-Verschiebung
  a.targetLoad = Math.min(1, a.targetLoad + 0.1);
  b.targetLoad = Math.max(0, b.targetLoad - 0.05);

  S.flowCount++;
}

// ─── WISP (sanfte Partikel zwischen Knoten) ────────────────────
function spawnWisp(from,to){
  S.wisps.push({
    ax:from.x, ay:from.y,
    bx:to.x, by:to.y,
    t:0,
    life:0,
    maxLife:80,
    color:from.color,
    size:1.6,
  });
}

// ─── SPARK (Impuls-Bursts) ─────────────────────────────────────
function spawnSpark(x,y,color){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2;
    const sp=0.5+Math.random()*1.8;
    S.sparks.push({
      x,y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:0, maxLife:25+Math.random()*30,
      color:color||'#7fdcff',
      size:0.8+Math.random()*1.2,
    });
  }
}

// ─── ROOT-MODUS ────────────────────────────────────────────────
function buildRootBranches(){
  S.rootBranches=[];
  NC_NODES.forEach(n=>{
    const branch={
      from:{x:CX,y:CY},
      to:{x:n.x,y:n.y},
      growth:0,
      targetGrowth:0,
      node:n,
    };
    S.rootBranches.push(branch);
  });
}
function toggleRoot(){
  S.root=!S.root;
  document.getElementById('btnRoot').classList.toggle('active',S.root);
  document.getElementById('rootIndicator').classList.toggle('show',S.root);
  document.getElementById('modeBadge').textContent = S.root?'ROOT':'CENTER';
  document.getElementById('sRoot').textContent = S.root?'an':'aus';
  if(S.root){
    S.rootBranches.forEach(b=>b.targetGrowth=1);
    log('🌱 ROOT erwacht — die Waage wird zur Wurzel.','root');
  } else {
    S.rootBranches.forEach(b=>b.targetGrowth=0);
    log('⚖️ zurück zum Zentrum.','scale');
  }
}

// ─── ZEICHNEN ──────────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);

  // ── Hintergrund: subtiler Radial-Glow um die Mitte
  const bg=ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*0.6);
  bg.addColorStop(0,'rgba(12,26,44,0.9)');
  bg.addColorStop(0.6,'rgba(6,13,24,0.6)');
  bg.addColorStop(1,'rgba(2,4,9,0)');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  // ── ROOT-Zweige (nur wenn Root-Modus aktiv)
  if(S.root || S.rootBranches.some(b=>b.growth>0.01)){
    drawRootBranches();
  }

  // ── RING (die äußere Umlaufbahn)
  ctx.beginPath();
  ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(127,220,255,0.08)';
  ctx.lineWidth=1;
  ctx.stroke();

  // ── INNERER RING
  ctx.beginPath();
  ctx.arc(CX,CY,R*0.6,0,Math.PI*2);
  ctx.strokeStyle='rgba(127,220,255,0.05)';
  ctx.setLineDash([4,8]);
  ctx.stroke();
  ctx.setLineDash([]);

  // ── ALLE-ZU-ALLE LINKS
  S.links.forEach(l=>{
    const strength = l.strength;
    if(strength<0.02) return;
    ctx.beginPath();
    ctx.moveTo(l.a.x, l.a.y);
    // leichte Wölbung zur Mitte
    const midX=(l.a.x+l.b.x)/2;
    const midY=(l.a.y+l.b.y)/2;
    const ctrlX=midX + (CX-midX)*0.35;
    const ctrlY=midY + (CY-midY)*0.35;
    ctx.quadraticCurveTo(ctrlX, ctrlY, l.b.x, l.b.y);
    // Farb-Gradient zwischen den beiden Knoten
    const grad=ctx.createLinearGradient(l.a.x,l.a.y,l.b.x,l.b.y);
    grad.addColorStop(0, l.a.color + Math.round(strength*120).toString(16).padStart(2,'0'));
    grad.addColorStop(0.5, 'rgba(200,240,255,'+(strength*0.4)+')');
    grad.addColorStop(1, l.b.color + Math.round(strength*120).toString(16).padStart(2,'0'));
    ctx.strokeStyle=grad;
    ctx.lineWidth=0.6 + strength*2.2;
    ctx.stroke();
  });

  // ── ZENTRUM: DIE WAAGE
  drawScale();

  // ── NC-KNOTEN
  NC_NODES.forEach(n=>drawNode(n));

  // ── WISPS (Partikel zwischen Knoten)
  S.wisps.forEach(w=>{
    const t=w.t;
    const x=w.ax+(w.bx-w.ax)*t;
    const y=w.ay+(w.by-w.ay)*t;
    const a=1-Math.abs(t-0.5)*2;
    ctx.beginPath();
    ctx.arc(x,y,w.size*(0.5+a*0.5),0,Math.PI*2);
    ctx.fillStyle=w.color;
    ctx.globalAlpha=a*0.85;
    ctx.shadowColor=w.color; ctx.shadowBlur=8;
    ctx.fill();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  });

  // ── SPARKS
  S.sparks.forEach(s=>{
    const a=1-s.life/s.maxLife;
    ctx.globalAlpha=a;
    ctx.fillStyle=s.color;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.size*(0.4+a*0.6),0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  });
}

// ─── WAAGE (Zentrum) ───────────────────────────────────────────
function drawScale(){
  const pulse=1+0.05*Math.sin(S.tick*0.04);
  const beamLen=R*0.55*pulse;
  const tiltAngle = S.tilt * 0.18; // rad
  const bx=CX, by=CY;

  // ── Äußerer Glow des Zentrums
  const g=ctx.createRadialGradient(bx,by,0,bx,by,R*0.9);
  g.addColorStop(0,'rgba(127,220,255,0.25)');
  g.addColorStop(0.5,'rgba(168,136,255,0.08)');
  g.addColorStop(1,'rgba(168,136,255,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(bx,by,R*0.9,0,Math.PI*2); ctx.fill();

  // ── Zentraler Kern: kleines Sechseck (Symbol der 6 NC)
  ctx.save();
  ctx.translate(bx,by);
  ctx.rotate(S.tick*0.004);
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2;
    const px=Math.cos(a)*10;
    const py=Math.sin(a)*10;
    if(i===0) ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.strokeStyle='rgba(200,240,255,0.7)';
  ctx.lineWidth=1.4;
  ctx.shadowColor='#7fdcff'; ctx.shadowBlur=14;
  ctx.stroke();
  ctx.shadowBlur=0;
  ctx.restore();

  // ── Waagebalken (rotiert mit tilt)
  ctx.save();
  ctx.translate(bx,by);
  ctx.rotate(tiltAngle);

  // Der Balken
  ctx.beginPath();
  ctx.moveTo(-beamLen,0);
  ctx.lineTo(beamLen,0);
  ctx.strokeStyle='rgba(240,200,120,0.85)';
  ctx.lineWidth=1.6;
  ctx.shadowColor='#f0c878'; ctx.shadowBlur=12;
  ctx.stroke();
  ctx.shadowBlur=0;

  // Schalen (links/rechts)
  drawPan(-beamLen,0,S.loadL,'#7fdcff');
  drawPan( beamLen,0,S.loadR,'#a888ff');

  ctx.restore();

  // ── Mittelpfeiler (senkrecht)
  ctx.beginPath();
  ctx.moveTo(bx,by-6);
  ctx.lineTo(bx,by+R*0.35);
  ctx.strokeStyle='rgba(200,240,255,0.28)';
  ctx.lineWidth=1;
  ctx.stroke();

  // ── Waage-Fuß
  ctx.beginPath();
  ctx.moveTo(bx-14, by+R*0.35);
  ctx.lineTo(bx+14, by+R*0.35);
  ctx.strokeStyle='rgba(200,240,255,0.5)';
  ctx.lineWidth=1.6;
  ctx.stroke();
}

function drawPan(px,py,load,color){
  // Ein Tropfen / eine Schale hängt an einem Faden vom Balken-Ende
  const threadLen = 18;
  const panR = 6 + load*8;

  ctx.beginPath();
  ctx.moveTo(px,py);
  ctx.lineTo(px,py+threadLen);
  ctx.strokeStyle='rgba(200,240,255,0.35)';
  ctx.lineWidth=0.8;
  ctx.stroke();

  // Schale (Halbkreis)
  ctx.beginPath();
  ctx.arc(px, py+threadLen, panR, 0, Math.PI);
  ctx.strokeStyle=color;
  ctx.lineWidth=1.4;
  ctx.shadowColor=color; ctx.shadowBlur=10;
  ctx.stroke();
  ctx.shadowBlur=0;

  // kleine Füllung je nach Last
  if(load>0.02){
    ctx.beginPath();
    ctx.arc(px, py+threadLen, panR*0.8, Math.PI*load, Math.PI);
    ctx.strokeStyle=color+'88';
    ctx.lineWidth=2;
    ctx.stroke();
  }
}

// ─── KNOTEN (NC-Sektionen) ─────────────────────────────────────
function drawNode(n){
  const pulse = 1 + n.pulse*0.6;
  const radius = 20 + n.load*14 + n.pulse*4;

  // Glow
  const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,radius*2.4);
  g.addColorStop(0, n.color+'cc');
  g.addColorStop(0.4, n.color+'44');
  g.addColorStop(1, n.color+'00');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(n.x,n.y,radius*2.4,0,Math.PI*2); ctx.fill();

  // Kreis
  ctx.beginPath();
  ctx.arc(n.x,n.y,radius,0,Math.PI*2);
  ctx.fillStyle='rgba(4,10,20,0.85)';
  ctx.fill();
  ctx.strokeStyle=n.color;
  ctx.lineWidth=1.6;
  ctx.shadowColor=n.color; ctx.shadowBlur=12;
  ctx.stroke();
  ctx.shadowBlur=0;

  // Innerer Puls-Ring
  if(n.pulse>0.05){
    ctx.beginPath();
    ctx.arc(n.x,n.y,radius*(1+n.pulse*0.8),0,Math.PI*2);
    ctx.strokeStyle=n.color+'55';
    ctx.lineWidth=1;
    ctx.stroke();
  }

  // Kanji
  ctx.fillStyle=n.color;
  ctx.font=`bold ${Math.round(radius*0.85)}px "Yu Mincho","Hiragino Mincho ProN",serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(n.kanji, n.x, n.y);

  // Label unter dem Knoten
  ctx.fillStyle='rgba(200,220,240,0.55)';
  ctx.font='8.5px Consolas';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(n.name, n.x, n.y + radius + 4);

  // Lastbalken
  if(n.load>0.02){
    const barW=radius*1.8;
    const barX=n.x-barW/2;
    const barY=n.y + radius + 16;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(barX, barY, barW, 2);
    ctx.fillStyle=n.color;
    ctx.fillRect(barX, barY, barW*n.load, 2);
  }
}

// ─── ROOT ZWEIGE ───────────────────────────────────────────────
function drawRootBranches(){
  S.rootBranches.forEach(b=>{
    if(b.growth<0.01) return;
    // Wurzel wächst vom Zentrum nach außen
    const ex=b.from.x + (b.to.x-b.from.x)*b.growth;
    const ey=b.from.y + (b.to.y-b.from.y)*b.growth;
    ctx.beginPath();
    ctx.moveTo(b.from.x, b.from.y);
    // leichte Krümmung
    const ctrlX=b.from.x + (b.to.x-b.from.x)*0.5 + Math.sin(S.tick*0.02)*6;
    const ctrlY=b.from.y + (b.to.y-b.from.y)*0.5 + Math.cos(S.tick*0.02)*6;
    ctx.quadraticCurveTo(ctrlX, ctrlY, ex, ey);
    ctx.strokeStyle=`rgba(240,200,120,${0.5*b.growth})`;
    ctx.lineWidth=1+b.growth*1.6;
    ctx.stroke();

    // Seitenzweige (kleine Härchen)
    if(b.growth>0.3){
      const midX=b.from.x+(b.to.x-b.from.x)*0.5;
      const midY=b.from.y+(b.to.y-b.from.y)*0.5;
      for(let k=0;k<3;k++){
        const angle=Math.atan2(b.to.y-b.from.y,b.to.x-b.from.x)
          + (k-1)*0.6;
        const l=8*b.growth;
        ctx.beginPath();
        ctx.moveTo(midX,midY);
        ctx.lineTo(midX+Math.cos(angle)*l, midY+Math.sin(angle)*l);
        ctx.strokeStyle=`rgba(240,200,120,${0.35*b.growth})`;
        ctx.lineWidth=0.7;
        ctx.stroke();
      }
    }
  });
}

// ─── UPDATE ────────────────────────────────────────────────────
function updateLinks(){
  S.links.forEach(l=>{
    // Aufbauen
    l.strength += (l.targetStrength - l.strength)*0.08;
    // Zerfall
    l.targetStrength *= 0.94;
    if(l.targetStrength<0.02) l.targetStrength=0;
  });
}
function updateNodes(){
  NC_NODES.forEach(n=>{
    n.load += (n.targetLoad - n.load)*0.06;
    n.pulse *= 0.92;
    if(n.pulse<0.01) n.pulse=0;
  });
  // Waage-Last: linke Hälfte (ces,me,sec) vs rechte Hälfte (in,run,u)
  const left = NC_NODES.filter(n=>Math.cos(n.angle)<0).reduce((s,n)=>s+n.load,0);
  const right= NC_NODES.filter(n=>Math.cos(n.angle)>=0).reduce((s,n)=>s+n.load,0);
  S.loadL=left/3;
  S.loadR=right/3;
  S.tilt = Math.max(-1,Math.min(1,(S.loadR-S.loadL)*1.4));
  S.force = left+right;
}
function updateWisps(dt){
  for(let i=S.wisps.length-1;i>=0;i--){
    const w=S.wisps[i];
    w.t += 0.018*(dt/16);
    w.life++;
    if(w.t>=1 || w.life>w.maxLife) S.wisps.splice(i,1);
  }
}
function updateSparks(dt){
  for(let i=S.sparks.length-1;i>=0;i--){
    const s=S.sparks[i];
    s.x += s.vx*(dt/16);
    s.y += s.vy*(dt/16);
    s.vx *= 0.95; s.vy *= 0.95;
    s.life++;
    if(s.life>s.maxLife) S.sparks.splice(i,1);
  }
}
function updateRoot(dt){
  S.rootBranches.forEach(b=>{
    b.growth += (b.targetGrowth - b.growth)*0.04;
  });
}

// ─── LOOP ──────────────────────────────────────────────────────
let lastT=0;
function loop(now){
  const dt=Math.min(48, now-lastT||16);
  lastT=now;
  S.tick++;

  if(S.auto) autoTick(now);

  updateLinks();
  updateNodes();
  updateWisps(dt);
  updateSparks(dt);
  updateRoot(dt);

  // Flow-Zähler: alle 1s zurücksetzen
  if(now - (S._flowReset||0) > 1000){
    S._flowReset=now;
    S._flowRate = S.flowCount;
    S.flowCount = 0;
  }

  draw();
  updateStats();
  requestAnimationFrame(loop);
}

// ─── STATS ─────────────────────────────────────────────────────
function updateStats(){
  const bal = (1 - Math.abs(S.tilt));
  document.getElementById('sBal').textContent=bal.toFixed(2);
  document.getElementById('sL').textContent=S.loadL.toFixed(2);
  document.getElementById('sR').textContent=S.loadR.toFixed(2);
  document.getElementById('bTilt').textContent=(S.tilt*10).toFixed(1)+'°';
  document.getElementById('bMid').textContent=(S.tilt*100).toFixed(0);
  document.getElementById('bForce').textContent=S.force.toFixed(2);
  document.getElementById('bFlow').textContent=(S._flowRate||0)+'/s';
}

// ─── LOG ───────────────────────────────────────────────────────
function log(msg,cls){
  const box=document.getElementById('logBox');
  const entry=document.createElement('div');
  const t=new Date().toLocaleTimeString('de-DE');
  entry.innerHTML=`<span class="time">[${t}]</span><span class="${cls||''}">${msg}</span>`;
  box.appendChild(entry);
  box.scrollTop=box.scrollHeight;
  while(box.children.length>30) box.removeChild(box.firstChild);
}

// ─── BUTTONS ───────────────────────────────────────────────────
document.getElementById('btnRoot').addEventListener('click',toggleRoot);

document.getElementById('btnAuto').addEventListener('click',(e)=>{
  S.auto=!S.auto;
  e.currentTarget.classList.toggle('active',S.auto);
  e.currentTarget.textContent=(S.auto?'⏸ AUTO':'▶ AUTO');
  log(`AUTO ${S.auto?'an':'aus'}`,'scale');
});

document.getElementById('btnShift').addEventListener('click',()=>{
  // Manueller Impuls: von einem zufälligen zu einem anderen Knoten
  const i=Math.floor(Math.random()*NC_NODES.length);
  const j=(i+1+Math.floor(Math.random()*5))%NC_NODES.length;
  pulseLink(NC_NODES[i],NC_NODES[j],0.9);
  spawnWisp(NC_NODES[i],NC_NODES[j]);
  NC_NODES[i].pulse=1;
  NC_NODES[j].pulse=0.8;
  spawnSpark(NC_NODES[i].x,NC_NODES[i].y,NC_NODES[i].color);
  log(`⇄ ${NC_NODES[i].name} → ${NC_NODES[j].name}`,'node');
});

document.getElementById('btnAll2All').addEventListener('click',()=>{
  // Jeder Knoten sendet zu jedem anderen
  NC_NODES.forEach(a=>{
    NC_NODES.forEach(b=>{
      if(a!==b){
        pulseLink(a,b,0.5+Math.random()*0.4);
        if(Math.random()<0.4) spawnWisp(a,b);
      }
    });
    a.pulse=1;
    spawnSpark(a.x,a.y,a.color);
  });
  log('✦ ALL-TO-ALL — jede Sektion spricht mit jeder.','root');
  sendToMaster('nc:all2all',{ts:Date.now(),nodes:NC_NODES.length});
});

document.getElementById('btnReset').addEventListener('click',()=>{
  NC_NODES.forEach(n=>{n.load=0;n.targetLoad=0;n.pulse=0;});
  S.links.forEach(l=>{l.strength=0;l.targetStrength=0;});
  S.wisps=[];S.sparks=[];
  log('⟲ Waage zur Ruhe gebracht.','scale');
});

document.getElementById('load').addEventListener('input',(e)=>{
  S.rate=parseInt(e.target.value,10);
});

// ─── CLICK auf Canvas: Last an den nächsten Knoten ────────────
cv.addEventListener('click',(e)=>{
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left;
  const y=e.clientY-r.top;

  // Nächsten Knoten finden
  let nearest=null, bestD=1e9;
  NC_NODES.forEach(n=>{
    const d=Math.hypot(x-n.x,y-n.y);
    if(d<bestD){bestD=d;nearest=n;}
  });

  if(nearest && bestD<80){
    // An diesen Knoten senden
    nearest.targetLoad=Math.min(1,nearest.targetLoad+0.2);
    nearest.pulse=1;
    spawnSpark(nearest.x,nearest.y,nearest.color);
    // Und von diesem Knoten an alle anderen
    NC_NODES.forEach(other=>{
      if(other!==nearest){
        pulseLink(nearest,other,0.4);
        if(Math.random()<0.5) spawnWisp(nearest,other);
      }
    });
    log(`⚖️ Last → ${nearest.name} → alle`,'node');
  } else {
    // Klick ins Zentrum: Waage kurz aus dem Gleichgewicht bringen
    S.tilt += (Math.random()-0.5)*0.6;
    distributeLoad(0.6);
    spawnSpark(CX,CY,'#f0c878');
    log('⚖️ Das Zentrum nimmt auf und verteilt.','scale');
  }
});

// ─── KEYBOARD ─────────────────────────────────────────────────
document.addEventListener('keydown',(e)=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key===' '){e.preventDefault();document.getElementById('btnShift').click();}
  if(e.key==='a'||e.key==='A') document.getElementById('btnAll2All').click();
  if(e.key==='r'||e.key==='R') document.getElementById('btnRoot').click();
  if(e.key==='p'||e.key==='P') document.getElementById('btnAuto').click();
});

// ─── CLOCK ────────────────────────────────────────────────────
function clock(){
  document.getElementById('sClock').textContent='⏱️ '+new Date().toLocaleTimeString('de-DE');
}
setInterval(clock,1000); clock();

// ─── API ──────────────────────────────────────────────────────
window.NC={
  scale:{
    center:()=>({x:CX,y:CY}),
    load:()=>({L:S.loadL,R:S.loadR,tilt:S.tilt,force:S.force}),
    distribute:(f)=>distributeLoad(f),
    shift:(from,to)=>{
      if(typeof from==='number' && typeof to==='number'){
        pulseLink(NC_NODES[from],NC_NODES[to],0.9);
      }
    },
  },
  root:{
    on:()=>{if(!S.root)toggleRoot();},
    off:()=>{if(S.root)toggleRoot();},
    toggle:toggleRoot,
  },
  nodes:()=>NC_NODES.map(n=>({
    id:n.id, name:n.name, kanji:n.kanji,
    load:n.load, angle:n.angle, x:n.x, y:n.y,
  })),
  all2all:()=>document.getElementById('btnAll2All').click(),
  state:()=>({
    tick:S.tick, auto:S.auto, root:S.root,
    loadL:S.loadL, loadR:S.loadR, tilt:S.tilt, force:S.force,
    flow:S._flowRate||0,
    links:S.links.filter(l=>l.strength>0.1).length,
    wisps:S.wisps.length,
    sparks:S.sparks.length,
  }),
  me2:{
    allow:()=>{localMaster.me2.allow=true;},
    block:()=>{localMaster.me2.allow=false;},
  },
  master:{
    connected:()=>isMasterConnected,
    state:()=>({...localMaster}),
  },
};
window.SCALE=window.NC;

// ─── INIT ─────────────────────────────────────────────────────
resize();

// Erster Impuls: alles zu allem, einmal
setTimeout(()=>{
  NC_NODES.forEach(a=>{
    NC_NODES.forEach(b=>{
      if(a!==b) pulseLink(a,b,0.3);
    });
  });
  log('✦ Alle zu allen — das Netz ist bereit.','root');
},600);

// Erstes sanftes Kippen
setTimeout(()=>distributeLoad(0.5), 1200);

log('⚖️ NC · WAAGSCHALE bereit — Zentrum und Root zugleich.','root');
log('6 Sektionen: ces · in · me · run · sec · u','node');
log('Space = Shift · A = All→All · R = Root · P = Auto','scale');

console.log('%c⚖️ NC · WAAGSCHALE geladen','color:#7fdcff;font-weight:bold;font-size:14px;');
console.log('→ window.NC.all2all() · .root.toggle() · .nodes() · .state()');

requestAnimationFrame(loop);
</script>
</body>
