<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔺 243 + iki1uc · Narrativ-Maschine</title>

<style>
/* dein kompletter Style bleibt unverändert */
</style>
</head>
<body>

<header>
    <h1>
        <span class="two43">243</span>
        <span style="color:#666;"> + </span>
        <span class="iki">iki1uc</span>
        <span style="color:#666;"> → NARRATIV</span>
    </h1>
</header>
<div class="card" id="admin0-card">
  <h3>🟥 ADMIN‑0 · Cockpit</h3>
  <div id="output-admin0" class="output">⏳ Admin‑0 bereit…</div>
  <button id="btn-admin0" class="primary">ADMIN‑0 anzeigen</button>
</div>

<div id="dashboard">
    <!-- deine Cards bleiben unverändert -->
</div>

<script type="module">
import { NarrativMaschine } from './core/243-iki1uc-verbindung.js';

// --- Kandidaten ---
const kandidaten = [
  'a','b','c','y','x','z','q','d','f',
  'OS','BOOT','iki1uc','243',
  'DOOR','DOO','RESPO','NC.engine',
  'SCORE','WETTE','SLIDE','AXIOM'
];

// --- Maschine ---
const maschine = new NarrativMaschine();
maschine.addKandidaten(kandidaten);

// --- Log ---
function log(msg, type='ok') {
    const logDiv = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    const cls = type === 'two43' ? 'two43' : type === 'iki' ? 'iki' : 'ok';
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${cls}">${msg}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
    while (logDiv.children.length > 30) logDiv.removeChild(logDiv.firstChild);
}

// --- Ausgabe 243 ---
function zeige243() {
    const out = document.getElementById('output-243');
    const narrative = maschine.engine243.zeigeNarrative();
    if (!narrative.length) {
        out.innerHTML = '⏳ Keine Triolets erzeugt.';
        return;
    }
    let text = `📐 ${narrative.length} Triolets erzeugt\n\n`;
    narrative.forEach((t, i) => {
        if (t.status === 'triolet') {
            text += `${i+1}. ${t.ecke1} ↔ ${t.ecke2} ↔ ${t.ecke3}\n`;
            text += `   Gewicht: ${t.gewicht}\n`;
        }
    });
    out.innerHTML = text;
}

// --- Ausgabe iki1uc ---
function zeigeIki() {
    const out = document.getElementById('output-iki');
    const sortierung = maschine.master.sortierung;

    if (!Object.keys(sortierung).length) {
        out.innerHTML = '⏳ Keine Sortierung vorhanden.';
        return;
    }

    let text = `📊 Sortierung:\n`;
    text += `  🔴 Schwer: ${sortierung.schwer?.length || 0}\n`;
    text += `  🟡 Mittel: ${sortierung.mittel?.length || 0}\n`;
    text += `  🟢 Leicht: ${sortierung.leicht?.length || 0}\n\n`;

    for (const [kategorie, items] of Object.entries(sortierung)) {
        if (items?.length) {
            text += `\n${kategorie}:\n`;
            items.forEach(item => {
                text += `  - ${item.ecke1} ↔ ${item.ecke2} ↔ ${item.ecke3}\n`;
            });
        }
    }
    out.innerHTML = text;
}

// --- Ausgabe Narrativ ---
function zeigeNarrativ() {
    const out = document.getElementById('output-narrativ');
    out.innerHTML = maschine.textNarrativ();
    log('📖 Narrativ erzeugt');
}

// --- Buttons ---
document.getElementById('btn-243').onclick = () => {
    const narrativ = maschine.verarbeiteAlle();
    log(`🔺 243: ${narrativ.triolets.length} Triolets erzeugt`, 'two43');
    zeige243();
};

document.getElementById('btn-iki').onclick = () => {
    const n = maschine.zeigeNarrativ();
    if (n.status === 'kein_narrativ') {
        log('⚠️ Bitte zuerst 243 verarbeiten');
        return;
    }
    maschine.master.sortiereNarrative(n.triolets);
    log('📊 iki1uc: Narrative sortiert', 'iki');
    zeigeIki();
};

document.getElementById('btn-narrativ').onclick = () => {
    const n = maschine.zeigeNarrativ();
    if (n.status === 'kein_narrativ') {
        log('⚠️ Bitte zuerst 243 verarbeiten');
        return;
    }
    zeigeNarrativ();
};

// --- Auto ---
log(`🔺 ${kandidaten.length} Kandidaten geladen`);
log(`📐 ${Math.floor(kandidaten.length / 3)} Dreiecke möglich`);

setTimeout(() => {
    document.getElementById('btn-243').click();
    setTimeout(() => document.getElementById('btn-iki').click(), 500);
    setTimeout(() => document.getElementById('btn-narrativ').click(), 1000);
}, 500);
// ============================================================
// ADMIN‑0 · COCKPIT · ROOT
// ============================================================

import { MXU } from './engine/mxu.js';
import { AXINXA } from './engine/AXINXA.js';
import { SLI } from './engine/SLI.js';

const ADMIN0 = MXU.init();
AXINXA.attach(ADMIN0);
SLI.attach(ADMIN0);

ADMIN0.cockpit = {
  control: "ACTIVE",
  industry: "6.0",
  economy: "IDLE",
  market: "IDLE",
  axis: ADMIN0.axis,
  height: 81,
  width: 9,
  depth: 3,
  axiom: "allxall · ANKER-Tech · Energie-Kugel",
  score: 0,
  energy: 0,
  decision: null
};

function showAdmin0(){
  document.getElementById('output-admin0').innerText =
    JSON.stringify(ADMIN0, null, 2);
  log("🟥 ADMIN‑0 Cockpit geöffnet");
}

document.getElementById('btn-admin0').onclick = showAdmin0;
document.getElementById('btn-admin0').onclick = () => {
  document.getElementById('output-admin0').innerText =
    JSON.stringify(ADMIN0, null, 2);
  log("🟥 ADMIN‑0 Cockpit geöffnet");
};


</script>

<script type="module">
import { VECTOR_SYSTEM } from './vector-system.js';
VECTOR_SYSTEM.init?.();
</script>

</body>
</html>
