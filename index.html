.flex{
  display: flex;
}
.break-all{
  word-break: break-all;
}
.border{
  border-width: 1px;
}
.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);

:root{
  --c:#0cf;
  --bg:#02060a;
  --go:gold;
  --au:#8cf0d0;
  --cy:#38c6e0;
  --pk:#ff3ea5;
  --warm:#ff8c66;
  --line:#1c1c26;
  --panel:#0a0a0f;
  --ink:#e8f4ff;
  --dim:#8fa3b8;
  --safe-area-inset-top:0px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#02060a;
    --panel:#0a0a0f;
    --line:#1c1c26;
    --ink:#e8f4ff;
  }
}
*{
  box-sizing:border-box;
}
html,body{
  background:var(--bg);
  color:var(--ink);
  overflow-x:clip;
}
body{
  font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  margin:0;
}
button{
  font:inherit;
}
.hdr{
  position:sticky;
  z-index:100;
  background:rgba(2,6,10,.96);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--c);
  padding:8px 12px;
}
.hdr-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.hdr-logo{
  font-size:18px;
  font-weight:800;
  letter-spacing:.15em;
  color:var(--c);
  text-shadow:0 0 12px var(--c);
}
.hdr-sub{
  font-size:9px;
  letter-spacing:.2em;
  color:#a855f7;
}
.hdr-badges{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  margin-left:auto;
}
.badge{
  padding:2px 6px;
  border:1px solid var(--line);
  font-size:9px;
  letter-spacing:.05em;
  border-radius:3px;
  color:var(--dim);
  background:transparent;
}
.badge.ok{
  background:rgba(140,240,208,.15);
  border-color:var(--au);
  color:var(--au);
}
.badge.warn{
  background:rgba(255,140,102,.15);
  border-color:var(--warm);
  color:var(--warm);
}
.badge.fix{
  border-color:var(--cy);
  color:var(--cy);
  background:rgba(56,198,224,.08);
}
.badge.master{
  background:var(--go);
  color:#000;
  border-color:var(--go);
  font-weight:800;
  animation:pulse 2s infinite;
}
button.badge{
  cursor:pointer;
}
@keyframes pulse{
  0%,100%{
    opacity:1
  }
  50%{
    opacity:.55
  }
}
.nav{
  display:flex;
  gap:2px;
  padding:6px 12px;
  background:#05080d;
  border-bottom:1px solid var(--line);
  overflow-x:auto;
  position:sticky;
  z-index:99;
}
.nav button{
  font-size:10px;
  padding:5px 10px;
  letter-spacing:.08em;
  white-space:nowrap;
  border-radius:3px;
  background:transparent;
  border:1px solid transparent;
  color:#7d8fa3;
  cursor:pointer;
}
.nav button.on{
  background:var(--c);
  color:#000;
  border-color:var(--c);
  font-weight:700;
}
.main{
  display:grid;
  grid-template-columns:210px minmax(0,1fr) 320px;
  gap:8px;
  padding:8px;
  align-items:start;
}
@media(max-width:1100px){
  .main{
    grid-template-columns:180px minmax(0,1fr);
  }
  .main>.side-right{
    display:none
  }
}
@media(max-width:760px){
  .main{
    grid-template-columns:minmax(0,1fr);
  }
  .main>.side-left{
    display:none
  }
}
.side-left{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  padding:8px;
}
.side-left .sec{
  font-size:9px;
  letter-spacing:.15em;
  color:#66788c;
  text-transform:uppercase;
  padding:8px 4px 4px;
  border-bottom:1px dashed var(--line);
  margin-bottom:4px;
  font-weight:700;
}
.side-left .item{
  padding:5px 8px;
  font-size:10px;
  border:1px solid transparent;
  border-radius:3px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  gap:6px;
  width:100%;
  text-align:left;
  background:transparent;
  color:#c8d8e8;
  margin-bottom:2px;
}
.side-left .item:hover{
  background:rgba(0,204,255,.06);
  border-color:var(--line);
}
.center{
  padding:10px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  min-width:0;
}
.side-right{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  padding:8px;
}
.dsec{
  background:#0a0a10;
  border:1px solid var(--line);
  border-radius:4px;
  padding:8px;
  margin-bottom:8px;
}
.dsec h3{
  font-size:9px;
  letter-spacing:.15em;
  color:var(--c);
  text-transform:uppercase;
  margin:0 0 6px;
  font-weight:700;
}
.drow{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:10px;
  padding:2px 0;
  color:var(--dim);
}
.drow b{
  color:#fff;
  text-align:right;
}
.vh{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
  gap:6px;
}
.vh h2{
  font-size:12px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--c);
  font-weight:700;
  margin:0;
}
.fixes{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-bottom:10px;
}
.kontro-meta{
  border:1px solid var(--go);
  background:#0a0a10;
  border-radius:6px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 0 12px rgba(255,215,0,.15);
}
.kontro-meta.warn{
  border-color:var(--warm);
  box-shadow:0 0 12px rgba(255,140,102,.15);
}
.kontro-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-bottom:12px;
}
@media(max-width:900px){
  .kontro-grid{
    grid-template-columns:1fr;
  }
}
.kcard{
  background:#0a0a10;
  border:1px solid var(--line);
  border-radius:6px;
  overflow:hidden;
}
.kcard.ok{
  border-color:var(--au);
}
.kcard.no{
  border-color:var(--warm);
}
.kcard-hdr{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 10px;
  border-bottom:1px solid var(--line);
  background:#05080d;
}
.kcard-axiom{
  padding:2px 6px;
  background:var(--go);
  color:#000;
  font-weight:800;
  font-size:10px;
  border-radius:2px;
}
.kcard-badge{
  padding:1px 5px;
  border:1px solid var(--line);
  font-size:8px;
  border-radius:2px;
  color:var(--dim);
  margin-left:3px;
}
.kcard-badge.ax{
  border-color:#0cf;
  color:#0cf;
}
.kcard-badge.rule{
  border-color:var(--warm);
  color:var(--warm);
}
.kcard-dot{
  width:6px;
  height:6px;
  border-radius:3px;
  flex:none;
}
.kcard-dot.ok{
  background:var(--au);
  box-shadow:0 0 6px var(--au);
}
.kcard-dot.err{
  background:var(--warm);
}
.kcard-sides{
  padding:6px 10px 0;
  display:flex;
  gap:4px;
  font-size:8px;
  flex-wrap:wrap;
}
.kcard-side{
  padding:1px 6px;
  background:#05080d;
  border:1px solid var(--line);
  border-radius:2px;
}
.kcard-state{
  padding:6px 10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2px 10px;
  font-size:9px;
}
.kcard-row{
  display:flex;
  justify-content:space-between;
  gap:6px;
  border-bottom:1px solid var(--line);
  padding:2px 0;
}
.kcard-row span:first-child{
  opacity:.45;
}
.kcard-row span:last-child{
  font-weight:700;
}
.kcard-proof{
  padding:0 10px 8px;
}
.proof-btn{
  width:100%;
  padding:4px 8px;
  background:#05080d;
  border:1px solid var(--line);
  font-size:9px;
  border-radius:3px;
  display:flex;
  justify-content:space-between;
  color:#c8d8e8;
  cursor:pointer;
}
.proof-btn:hover{
  border-color:var(--c);
  color:var(--c);
}
.proof-body{
  margin-top:6px;
  background:#05080d;
  border:1px solid var(--line);
  padding:8px;
  border-radius:4px;
  font-size:8.5px;
  line-height:1.45;
}
.proof-sect{
  margin-bottom:6px;
}
.proof-sect-hdr{
  font-size:8px;
  letter-spacing:.15em;
  color:#66788c;
  text-transform:uppercase;
  margin-bottom:3px;
  padding-bottom:2px;
  border-bottom:1px dashed var(--line);
}
.proof-claim{
  color:var(--go);
  font-weight:700;
  margin-bottom:3px;
}
.proof-line{
  color:var(--dim);
  padding-left:6px;
}
.proof-line.ok{
  color:var(--au);
}
.axiom-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}
@media(max-width:760px){
  .axiom-grid{
    grid-template-columns:1fr;
  }
}
.axiom-panel{
  background:#0a0a10;
  border:1px solid var(--line);
  border-radius:4px;
  padding:10px;
  min-width:0;
}
.axiom-panel h3{
  font-size:9px;
  letter-spacing:.15em;
  color:var(--go);
  text-transform:uppercase;
  margin:0 0 8px;
  font-weight:700;
}
.axiom-row{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) 64px 46px;
  gap:6px;
  align-items:center;
  padding:4px 0;
  border-bottom:1px dashed var(--line);
  font-size:9px;
}
.axiom-row .atom{
  color:#0cf;
  font-weight:700;
}
.axiom-row .name{
  color:var(--dim);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.axiom-row .val{
  color:var(--go);
  font-weight:700;
  text-align:right;
}
.axiom-row .exec{
  padding:1px 6px;
  border:1px solid var(--line);
  border-radius:2px;
  font-size:8px;
  background:#05080d;
  color:#66788c;
  cursor:pointer;
}
.axiom-row .exec:hover{
  border-color:var(--go);
  color:var(--go);
}
.rule-row{
  display:grid;
  grid-template-columns:32px minmax(0,1fr) auto;
  gap:6px;
  padding:4px 0;
  border-bottom:1px dashed var(--line);
  font-size:9px;
  align-items:center;
}
.rule-row .rid{
  color:var(--warm);
  font-weight:700;
}
.rule-row .rname{
  color:var(--dim);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.rule-row .rstatus{
  padding:1px 5px;
  border-radius:2px;
  font-size:8px;
  font-weight:700;
}
.rule-row .rstatus.ok{
  background:var(--au);
  color:#000;
}
.rule-row .rstatus.err{
  background:var(--warm);
  color:#000;
}
.formel{
  background:#0a0a10;
  border:1px solid var(--go);
  border-radius:6px;
  padding:12px;
  box-shadow:0 0 12px rgba(255,215,0,.15);
  font-size:11px;
  line-height:1.6;
  word-break:break-word;
}
.quad-axes{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:4px;
  margin-bottom:12px;
}
@media(max-width:900px){
  .quad-axes{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}
@media(max-width:420px){
  .quad-axes{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
.qaxis{
  background:#0a0a10;
  border:1px solid var(--line);
  border-radius:4px;
  padding:6px;
  text-align:center;
  cursor:pointer;
}
.qaxis:hover{
  border-color:var(--c);
  background:rgba(0,204,255,.06);
}
.qaxis.on{
  border-color:var(--c);
  background:rgba(0,204,255,.15);
  box-shadow:0 0 8px var(--c);
}
.qaxis .name{
  font-size:14px;
  font-weight:800;
  color:var(--c);
}
.qaxis .slot{
  font-size:8px;
  color:#66788c;
  letter-spacing:.1em;
}
.qaxis .val{
  font-size:11px;
  font-weight:700;
  color:var(--go);
}
.panelbox{
  background:#0a0a10;
  border:1px solid var(--line);
  border-radius:6px;
  padding:12px;
  margin-bottom:12px;
}
.panelbox.gold{
  border-color:var(--go);
  box-shadow:0 0 12px rgba(255,215,0,.15);
}
.frow{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:4px 0;
  border-bottom:1px dashed var(--line);
  font-size:10px;
}
.octa-panel{
  border:2px solid var(--go);
  background:#0a0a10;
  border-radius:6px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 0 20px rgba(255,215,0,.15);
}
.octa-layer{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  margin-bottom:8px;
}
@media(max-width:560px){
  .octa-layer{
    grid-template-columns:1fr;
  }
}
.octa-layer div{
  background:#05080d;
  border:1px solid var(--line);
  border-radius:3px;
  padding:6px;
  font-size:9px;
  text-align:center;
  color:var(--dim);
}
.octa-layer div b{
  display:block;
  color:var(--go);
  font-size:11px;
  margin-bottom:2px;
}
.idx-grid{
  display:flex;
  flex-wrap:wrap;
  gap:2px;
  margin-bottom:12px;
}
.idx-cell{
  width:14px;
  height:14px;
  border-radius:2px;
  cursor:pointer;
  border:1px solid rgba(0,0,0,.3);
  position:relative;
  flex:none;
  padding:0;
}
.idx-cell:hover{
  transform:scale(1.5);
  z-index:10;
  box-shadow:0 0 10px currentColor;
}
.idx-cell.sel{
  outline:2px solid #fff;
  outline-offset:-1px;
}
.idx-cell.ram{
  outline:2px solid var(--au);
  outline-offset:-1px;
}
.idx-cell.ram::after{
  content:"●";
  position:absolute;
  top:-5px;
  right:-4px;
  font-size:8px;
  color:var(--au);
  text-shadow:0 0 4px var(--au);
}
.wurzel-grid{
  display:grid;
  grid-template-columns:repeat(9,20px);
  gap:2px;
}
@media(max-width:420px){
  .wurzel-grid{
    grid-template-columns:repeat(9,minmax(0,1fr));
  }
}
.wurzel-cell{
  width:20px;
  height:20px;
  background:linear-gradient(135deg,var(--go),var(--warm));
  border-radius:2px;
  cursor:pointer;
  border:0;
  padding:0;
}
.wurzel-cell.ram{
  box-shadow:0 0 0 2px var(--au) inset, 0 0 8px var(--au);
}
.progress{
  height:5px;
  background:#05080d;
  border-radius:3px;
  overflow:hidden;
  border:1px solid var(--line);
}
.progress>div{
  height:100%;
  background:linear-gradient(90deg,var(--au),var(--go));
  transition:width .3s;
}
.pipe-row{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:4px;
  margin-bottom:12px;
}
@media(max-width:900px){
  .pipe-row{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}
.pipe-stage{
  background:#0a0a10;
  border:1px solid var(--line);
  border-radius:4px;
  padding:6px;
  text-align:center;
  font-size:9px;
}
.pipe-stage.done{
  border-color:var(--au);
  background:rgba(140,240,208,.08);
}
.pipe-stage.running{
  border-color:var(--go);
  background:rgba(255,215,0,.15);
  animation:pulse 1.5s infinite;
}
.pipe-stage .circle{
  width:24px;
  height:24px;
  border-radius:50%;
  border:1px solid;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 4px;
  font-weight:700;
  font-size:11px;
}
.pipe-stage.done .circle{
  color:var(--au);
}
.pipe-stage.running .circle{
  color:var(--go);
}
.pipe-stage.idle .circle{
  color:#445;
}
.pipe-stage .lbl{
  font-weight:700;
  color:#c8d8e8;
}
.pipe-stage .sub{
  font-size:8px;
  color:#66788c;
  margin-top:2px;
}
.btn{
  font-size:11px;
  color:#fff;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.15);
  border-radius:4px;
  padding:4px 8px;
  cursor:pointer;
}
.btn:hover{
  border-color:var(--c);
  color:var(--c);
}
.btn.on{
  background:var(--c);
  color:#000;
  border-color:var(--c);
  font-weight:700;
}
.btn:disabled{
  opacity:.45;
  cursor:default;
}
.log{
  background:#05080d;
  border:1px solid var(--line);
  border-radius:4px;
  padding:8px;
  font-size:9px;
  line-height:1.5;
  max-height:170px;
  overflow-y:auto;
  color:var(--dim);
}
.log div{
  border-left:2px solid var(--line);
  padding-left:6px;
  margin-bottom:2px;
}
.log div.ok{
  border-color:var(--au);
  color:var(--au);
}
.ftr{
  background:rgba(2,6,10,.95);
  border-top:1px solid var(--line);
  padding:6px 12px;
  font-size:9px;
  color:#66788c;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:6px;
}
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--go);
  color:#000;
  padding:6px 14px;
  font-weight:700;
  font-size:11px;
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
  z-index:200;
  border-radius:4px;
  max-width:92vw;
  text-align:center;
}
.toast.show{
  opacity:1;
}
.hbt{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  margin-bottom:12px;
}
@media(max-width:560px){
  .hbt{
    grid-template-columns:1fr;
  }
}
.hbt div{
  background:#05080d;
  border:1px solid var(--line);
  border-radius:4px;
  padding:8px;
  font-size:9px;
  color:var(--dim);
  line-height:1.5;
}
.hbt b{
  color:var(--cy);
  display:block;
  font-size:10px;
  margin-bottom:2px;
}
