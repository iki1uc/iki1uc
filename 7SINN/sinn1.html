<body>

<h1>SINN 1 – BASIS + Bewertung</h1>
<textarea id="src" placeholder="HTML einfügen…"></textarea>
<button onclick="scan()">SCAN</button>
<pre id="out"></pre>

<script>
// ------------------------------------------------------
// 7SINN – Bewertungssystem (Standalone)
// ------------------------------------------------------
function RATE(achse, wert, norm){
  return {
    achse,
    wert,
    norm,
    delta: wert - norm,
    status:
      wert === norm ? "Norm" :
      wert > norm && wert < norm * 3 ? "Übernorm" :
      wert >= norm * 3 ? "Extrem" :
      "Unternorm"
  };
}

// ------------------------------------------------------
// SINN 1 – Struktur-Scan + Bewertung
// ------------------------------------------------------

  const t = src.value;
  if(!t.trim()){
    out.textContent = "Keine Eingabe.";
    return;
  }

  d.querySelectorAll("*").forEach(e=>{
    const tag = e.tagName.toLowerCase();
    tags[tag] = (tags[tag]||0)+1;
  });
