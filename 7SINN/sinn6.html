<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>7SINN · Sinn 6</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:16px;}
textarea{width:100%;height:180px;background:#111;color:#0f0;border:1px solid #333;}
pre{background:#111;padding:12px;margin-top:12px;white-space:pre-wrap;}
button{padding:6px 12px;background:#111;color:#0f0;border:1px solid #333;cursor:pointer;}
</style>
</head>
<body>

<h1>SINN 6 – EVENT‑SCAN + Bewertung</h1>
<textarea id="src" placeholder="HTML einfügen…"></textarea>
<button onclick="scan()">SCAN</button>
<pre id="out"></pre>

<script>
// ------------------------------------------------------
// 7SINN – Bewertungssystem (Standalone)
// ------------------------------------------------------
function RATE(achse, wert, norm){
  return {
    achse,
    wert,
    norm,
    delta: wert - norm,
    status:
      wert === norm ? "Norm" :
      wert > norm && wert < norm * 3 ? "Übernorm" :
      wert >= norm * 3 ? "Extrem" :
      "Unternorm"
  };
}

// ------------------------------------------------------
// SINN 6 – Event-Scan + Bewertung
// ------------------------------------------------------
function scan(){
  const t = src.value;
  if(!t.trim()){
    out.textContent = "Keine Eingabe.";
    return;
  }

  const p = new DOMParser();
  const d = p.parseFromString(t,"text/html");

  const onclick = [...d.querySelectorAll("[onclick]")].length;
  const oninput = [...d.querySelectorAll("[oninput]")].length;
  const onchange = [...d.querySelectorAll("[onchange]")].length;

  // Event-Sinn = Summe aller Event-Attribute
  const sinnWert = onclick + oninput + onchange;
  const sinnNorm = 8; // Norm für Event-Sinn

  const rating = RATE("Sinn-Event", sinnWert, sinnNorm);

  let o = "SINN 6 – EVENT‑SCAN + Bewertung\n\n";
  o += "Event-Sinn: " + sinnWert + "\n";
  o += "Norm: " + sinnNorm + "\n";
  o += "Delta: " + rating.delta + "\n";
  o += "Status: " + rating.status + "\n\n";

  o += "DETAILS:\n";
  o += `onclick: ${onclick}\n`;
  o += `oninput: ${oninput}\n`;
  o += `onchange: ${onchange}\n`;

  out.textContent = o;
}
</script>

<!-- EICH + GEN + MARKE dürfen nicht entfernt werden -->
</body>
</html>
