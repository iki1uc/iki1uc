<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>7SINN · Sinn 4</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:16px;}
textarea{width:100%;height:180px;background:#111;color:#0f0;border:1px solid #333;}
pre{background:#111;padding:12px;margin-top:12px;white-space:pre-wrap;}
button{padding:6px 12px;background:#111;color:#0f0;border:1px solid #333;cursor:pointer;}
</style>
</head>
<body>

<h1>SINN 4 – SCRIPT‑SCAN + Bewertung</h1>
<textarea id="src" placeholder="HTML einfügen…"></textarea>
<button onclick="scan()">SCAN</button>
<pre id="out"></pre>

<script>
// ------------------------------------------------------
// 7SINN – Bewertungssystem (Standalone)
// ------------------------------------------------------
function RATE(achse, wert, norm){
  return {
    achse,
    wert,
    norm,
    delta: wert - norm,
    status:
      wert === norm ? "Norm" :
      wert > norm && wert < norm * 3 ? "Übernorm" :
      wert >= norm * 3 ? "Extrem" :
      "Unternorm"
  };
}

// ------------------------------------------------------
// SINN 4 – Script-Scan + Bewertung
// ------------------------------------------------------
function scan(){
  const t = src.value;
  if(!t.trim()){
    out.textContent = "Keine Eingabe.";
    return;
  }

  const p = new DOMParser();
  const d = p.parseFromString(t,"text/html");

  const scripts = [...d.querySelectorAll("script")];
  const ext = scripts.filter(s=>s.src).map(s=>s.src);
  const inline = scripts.filter(s=>!s.src).length;

  // Script-Sinn = Inline + Extern
  const sinnWert = scripts.length;
  const sinnNorm = 5; // Norm für Script-Sinn

  const rating = RATE("Sinn-Script", sinnWert, sinnNorm);

  let o = "SINN 4 – SCRIPT‑SCAN + Bewertung\n\n";
  o += "Script-Sinn: " + sinnWert + "\n";
  o += "Norm: " + sinnNorm + "\n";
  o += "Delta: " + rating.delta + "\n";
  o += "Status: " + rating.status + "\n\n";

  o += "DETAILS:\n";
  o += `Scripts total: ${scripts.length}\n`;
  o += `Inline: ${inline}\n`;
  o += `Extern:\n`;
  ext.forEach(e=>o+=`- ${e}\n`);

  out.textContent = o;
}
</script>

<!-- EICH + GEN + MARKE dürfen nicht entfernt werden -->
</body>
</html>
