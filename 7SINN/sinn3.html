<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>7SINN · Sinn 3</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:16px;}
textarea{width:100%;height:180px;background:#111;color:#0f0;border:1px solid #333;}
pre{background:#111;padding:12px;margin-top:12px;white-space:pre-wrap;}
button{padding:6px 12px;background:#111;color:#0f0;border:1px solid #333;cursor:pointer;}
</style>
</head>
<body>

<h1>SINN 3 – MASSE + Bewertung</h1>
<textarea id="src" placeholder="HTML einfügen…"></textarea>
<button onclick="scan()">SCAN</button>
<pre id="out"></pre>

<script>
// ------------------------------------------------------
// 7SINN – Bewertungssystem (Standalone)
// ------------------------------------------------------
function RATE(achse, wert, norm){
  return {
    achse,
    wert,
    norm,
    delta: wert - norm,
    status:
      wert === norm ? "Norm" :
      wert > norm && wert < norm * 3 ? "Übernorm" :
      wert >= norm * 3 ? "Extrem" :
      "Unternorm"
  };
}

// ------------------------------------------------------
// SINN 3 – Masse-Scan + Bewertung
// ------------------------------------------------------
function scan(){
  const t = src.value;
  if(!t.trim()){
    out.textContent = "Keine Eingabe.";
    return;
  }

  // Masse zählen
  const divs = (t.match(/<div/g)||[]).length;
  const spans = (t.match(/<span/g)||[]).length;
  const sections = (t.match(/<section/g)||[]).length;

  // Masse-Sinn = Summe aller Masse-Tags
  const sinnWert = divs + spans + sections;
  const sinnNorm = 15; // Norm für Masse-Sinn

  const rating = RATE("Sinn-Masse", sinnWert, sinnNorm);

  let o = "SINN 3 – MASSE + Bewertung\n\n";
  o += "Masse-Sinn: " + sinnWert + "\n";
  o += "Norm: " + sinnNorm + "\n";
  o += "Delta: " + rating.delta + "\n";
  o += "Status: " + rating.status + "\n\n";

  o += "DETAILS:\n";
  o += `DIV: ${divs}\n`;
  o += `SPAN: ${spans}\n`;
  o += `SECTION: ${sections}\n`;

  out.textContent = o;
}
</script>

<!-- EICH + GEN + MARKE dürfen nicht entfernt werden -->
</body>
</html>
