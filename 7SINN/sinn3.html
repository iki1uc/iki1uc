<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>7SINN · Sinn 3</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:16px;}
textarea{width:100%;height:180px;background:#111;color:#0f0;border:1px solid #333;}
pre{background:#111;padding:12px;margin-top:12px;white-space:pre-wrap;}
button{padding:6px 12px;background:#111;color:#0f0;border:1px solid #333;cursor:pointer;}
</style>
</head>
<body>

<h1>SINN 3 – MASSE</h1>
<textarea id="src"></textarea>
<button onclick="scan()">SCAN</button>
<pre id="out"></pre>

<script>
function scan(){
  const t = src.value;
  const divs = (t.match(/<div/g)||[]).length;
  const spans = (t.match(/<span/g)||[]).length;
  const sections = (t.match(/<section/g)||[]).length;
  let o = "SINN 3 – MASSE\n";
  o += `DIV: ${divs}\nSPAN: ${spans}\nSECTION: ${sections}\n`;
  out.textContent = o;
}
</script>

</body>
</html>
