:root {
  --bg: #06080c;

  --bg3: #111824;
  --line: rgba(255, 255, 255, 0.08);
  --green: #2cff8a;
  --gold: #ffd700;
  --magenta: #ff2d9a;
  --cyan: #66d9ff;
  --text: #d2dfef;
  --muted: rgba(210, 223, 239, 0.68);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #06080c;
    --bg2: #0c1017;
    --bg3: #111824;
    --text: #d2dfef;
  }
}

* {
  box-sizing: border-box;
}

}

  color: var(--text);
  font-family: Consolas, "Courier New", monospace;
}

button, input {

}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.mono {
  font-family: Consolas, "Courier New", monospace;
}

.panel {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 14px;
}

.raid-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}

.raid-entry {
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  font-size: 10px;
  line-height: 1.5;
  min-width: 0;
}

@media (max-width: 768px) {
  .raid-grid {
    grid-template-columns: 1fr;
  }
}

.raid-entry.confirmed {
  border-color: rgba(44, 255, 138, .35);
}

.raid-entry.unverified {
  border-color: rgba(255, 215, 0, .35);
}

.raid-entry.conflict {
  border-color: rgba(255, 45, 154, .35);
}

.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 10px;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.badge.confirmed {
  background: rgba(44, 255, 138, .1);
  color: var(--green);
}

.badge.unverified {
  background: rgba(255, 215, 0, .1);
  color: var(--gold);
}

.badge.conflict {
  background: rgba(255, 45, 154, .1);
  color: var(--magenta);
}

.field {
  flex: 1 1 180px;
  min-width: 0;
  padding: 11px 12px;
  background: var(--bg2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 10px;
  outline: none;
}

.field:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px rgba(102, 217, 255, .16);

.field::-moz-placeholder {
  color: rgba(210, 223, 239, .38);
}

.field::placeholder {
  color: rgba(210, 223, 239, .38);
}

  word-break: break-word;
