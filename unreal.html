        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
        :root{
          --bg:#02060a; --bg2:#070e1a; --panel:#0c1729; --panel2:#111f36;
          --line:#1b2d4d; --line2:rgba(212,175,55,.28);
          --fg:#d6deea; --muted:#7a8aa3;
          --gold:#d4af37; --gold2:#f5d76e;
          --green:#6de090; --red:#ff5a5a; --cyan:#22d3ee; --pink:#ff5a8a;
          --violet:#a78bfa;
          --surface: var(--panel);
        }
        *{box-sizing:border-box}
        html,body{margin:0;padding:0}
        body{background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',monospace;}
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-thumb{background:rgba(212,175,55,.25)}
        .hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;
          padding:8px 14px;border-bottom:1px solid var(--line);
          background:var(--panel);position:sticky;top:var(--safe-area-inset-top);z-index:50;flex-wrap:wrap}
        .omega{width:32px;height:32px;background:var(--gold);color:#000;
          display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
        .hdr-title h1{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.04em;margin:0}
        .hdr-title small{font-size:10px;color:var(--muted);letter-spacing:.06em}
        .hdr-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
        .gate-badge{padding:4px 10px;border:1px solid;border-radius:0;
          font-size:10px;letter-spacing:.1em;font-weight:700;transition:all .3s}
        .gate-badge.open{color:#000;background:var(--green);border-color:var(--green)}
        .gate-badge.closed{color:var(--red);border-color:var(--red)}
        .gate-mini{display:flex;gap:4px;font-size:9px;flex-wrap:wrap}
        .gate-mini .m{padding:2px 6px;border:1px solid;letter-spacing:.05em}
        .gate-mini .m.ok{color:var(--green);border-color:var(--green)}
        .gate-mini .m.no{color:var(--red);border-color:var(--red)}
        .shell{display:grid;grid-template-columns:1fr 340px;gap:0;min-height:calc(100vh - 52px);max-width:1600px;margin:0 auto;width:100%}
        @media(max-width:1000px){.shell{grid-template-columns:1fr}}
        .main{background:var(--bg);overflow:auto;max-height:calc(100vh - 52px);padding:14px;display:flex;flex-direction:column;gap:14px}
        .sidebar{background:var(--panel);border-left:1px solid var(--line);padding:10px;overflow-y:auto;max-height:calc(100vh - 52px)}
        @media(max-width:1000px){.sidebar{border-left:0;border-top:1px solid var(--line);max-height:none}.main{max-height:none;overflow:visible}}
        .section{border:1px solid var(--line);background:var(--panel);position:relative}
        .section-hdr{display:flex;align-items:center;justify-content:space-between;
          padding:8px 12px;border-bottom:1px solid var(--line);
          background:var(--panel2);font-size:10px;letter-spacing:.2em;
          text-transform:uppercase;color:var(--gold);font-weight:700}
        .section-hdr .badge{font-size:9px;padding:1px 6px;border:1px solid var(--line);
          color:var(--muted);letter-spacing:.05em;text-transform:none}
        .section-body{padding:12px}
        .w27{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        @media(max-width:700px){.w27{grid-template-columns:1fr}}
        .w27-layer{border:1px dashed var(--line);padding:6px}
        .w27-layer .lbl{font-size:9px;color:var(--muted);letter-spacing:.15em;text-align:center;padding-bottom:4px;text-transform:uppercase}
        .w27-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
        .w27-cell{aspect-ratio:1;border:1px solid var(--line);background:var(--bg2);
          display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:1px;cursor:pointer;transition:all .15s;font-size:9px;padding:2px;user-select:none}
        .w27-cell:hover{transform:scale(1.05);border-color:var(--gold)}
        .w27-cell.mitte{background:var(--gold);color:#000;font-weight:700;border-color:var(--gold);box-shadow:0 0 12px var(--gold)}
